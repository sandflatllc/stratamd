name: check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      STRATAMD_LINUX_TOOLCHAIN: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set verification evidence directory
        run: echo "STRATAMD_VERIFY_HOME=$RUNNER_TEMP/stratamd-verification" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      # pnpm's build-script approval does not reliably run electron's install
      # script, which downloads the binary; run it explicitly so dist/ exists
      # before anything depends on it.
      - run: node node_modules/electron/install.js
        timeout-minutes: 5
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, so any
      # Electron started outside Playwright (the dictionary fetch, the
      # second-instance spec's direct spawn) needs the setuid sandbox helper
      # configured; without this it dies with the SUID sandbox error.
      - run: sudo chown root node_modules/electron/dist/chrome-sandbox
      - run: sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # The spellcheck e2e spec seeds Hunspell dictionaries from the profile;
      # a fresh runner has none, so fetch en-US through Electron's own path.
      - run: xvfb-run --auto-servernum npx electron scripts/fetch-spell-dictionary.mjs
        timeout-minutes: 5
      # Native desktop-composition evidence needs the X11 capture command.
      - run: sudo apt-get update && sudo apt-get install -y imagemagick gcc-13 g++-13 make
        timeout-minutes: 10
      - run: ./node_modules/.bin/node-gyp rebuild --directory native/unix-support
        timeout-minutes: 5
      - run: node scripts/verify.mjs full --task ci
      - run: node scripts/verify.mjs stress --task ci
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: node scripts/verify.mjs managed --task ci
      # `stratamd setup` registers desktop and MIME associations through
      # update-desktop-database/update-mime-database; the runner image ships
      # without them, so the packaged-CLI test's real setup run needs both.
      - run: sudo apt-get install -y desktop-file-utils shared-mime-info
        timeout-minutes: 5
      - run: xvfb-run -a node scripts/verify.mjs packaged --task ci --finish-task
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification
          path: ${{ runner.temp }}/stratamd-verification/
          retention-days: 14

  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Set verification evidence directory
        run: echo "STRATAMD_VERIFY_HOME=$RUNNER_TEMP/stratamd-verification" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - run: node node_modules/electron/install.js
        timeout-minutes: 5
      - run: ./node_modules/.bin/node-gyp rebuild --directory native/unix-support
        timeout-minutes: 5
      - run: node scripts/verify.mjs full --task ci
      - run: node scripts/verify.mjs stress --task ci
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: node scripts/verify.mjs managed --task ci
      - run: node scripts/verify.mjs packaged --task ci --finish-task
      # Playwright traces and screenshots are the only way to see a Mac-only
      # e2e failure without owning a Mac.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-verification
          path: ${{ runner.temp }}/stratamd-verification/
          retention-days: 14
      # ditto keeps execute bits and bundle structure; upload-artifact alone
      # strips permissions. The zip is what a tester downloads and dequarantines.
      - run: |
          strata_package_app=$(python3 -c 'import os,pathlib; print(next(pathlib.Path(os.environ["STRATAMD_VERIFY_HOME"]).glob("runs/*/package/mac*/StrataMD.app")))')
          ditto -c -k --keepParent "$strata_package_app" StrataMD-mac.zip
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: StrataMD-mac
          path: StrataMD-mac.zip
          retention-days: 14
