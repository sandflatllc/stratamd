name: release

# Pushing a v* tag builds the Mac app, verifies the packaged layout, and
# publishes the zip as a GitHub Release — a public download link with no
# GitHub login, unlike workflow artifacts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac-app:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      # Builds the .app and proves the packaged CLI and bundle layout work.
      - run: pnpm test:packaged
      - run: ditto -c -k --keepParent dist/mac*/StrataMD.app StrataMD-mac.zip
      - run: |
          gh release create "$GITHUB_REF_NAME" StrataMD-mac.zip \
            --title "StrataMD $GITHUB_REF_NAME" \
            --notes "Download **StrataMD-mac.zip**, unzip it, and drag StrataMD to your Applications folder.

          The first time you open it, macOS will say it can't check the app for malicious software. That's because this build isn't registered with Apple yet — to open it anyway: open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**, then open StrataMD again. You only have to do this once."
        env:
          GH_TOKEN: ${{ github.token }}
