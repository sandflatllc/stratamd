name: Windows native
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      STRATAMD_VERIFY_HOME: C:\strata-verification
    steps:
      - uses: actions/checkout@v4
        with:
          path: strata
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: strata/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: strata
        run: pnpm install --frozen-lockfile
      - name: Prepare Electron and native platform module
        working-directory: strata
        run: |
          node node_modules/electron/install.js
          node node_modules/node-gyp/bin/node-gyp.js rebuild --directory native/unix-support
      - name: Windows native contracts and document workflows
        working-directory: strata
        run: node scripts/verify.mjs focused --task windows-ci --unit test/unit/windows-verification-process.test.ts --unit test/unit/account-shims.test.ts --unit test/unit/local-usage.test.ts --unit test/unit/platform-commands.test.ts --unit test/unit/windows-process-health.test.ts --unit test/unit/engine-native.test.ts --unit test/unit/windows-platform.test.ts --unit test/unit/windows-lifecycle.test.ts --unit test/unit/platform-paths.test.ts --unit test/unit/platform-fonts.test.ts --unit test/unit/link-target.test.ts --e2e test/e2e/prd-6.12.spec.ts
      - name: Bundled engine on Windows
        working-directory: strata
        run: node scripts/verify.mjs managed --task windows-ci
      - name: Build and verify Windows installer
        working-directory: strata
        run: node scripts/verify.mjs packaged --task windows-ci --finish-task
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: C:\strata-verification
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: StrataMD-windows-x64
          path: C:\strata-verification\runs\*\package\*.exe
          retention-days: 14
