function dot(a) { return `<button class="dot" data-state="${a.state}" data-depth="${a.depth}" title="${a.title} · ${a.state}" aria-label="${a.title}, ${a.state}"></button>` }
function families(list) {
  const kids = (id) => list.filter(a => a.parent === id).flatMap(k => [k, ...kids(k.id)])
  return list.filter(a => a.depth === 1).map(r => ({ root: r, all: [r, ...kids(r.id)] }))
}
/** Start order with each parent's children right after it, so a family fills adjacent slots. */
function ordered(list) {
  const out = []
  const walk = (parent) => list.filter(a => (a.parent ?? null) === parent).forEach(a => { out.push(a); walk(a.id) })
  walk(null); return out
}
const SLOTS = 6
/** Arc for slot i of six, clockwise from the top. Depth shortens the dash: L1 40°, L2 26°, L3+ 14°. */
function arc(i, depth, state, title) {
  const span = depth === 1 ? 40 : depth === 2 ? 26 : 14
  const centre = -90 + i * 60; const a0 = (centre - span / 2) * Math.PI / 180; const a1 = (centre + span / 2) * Math.PI / 180
  const r = 11, c = 13
  const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1)
  return `<path class="seg" data-state="${state}" d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"><title>${title}</title></path>`
}
const BOT = `<g class="bot"><rect x="8.5" y="10.5" width="9" height="7.5" rx="2"/><path d="M13 10.5V7.5"/><circle cx="13" cy="6.8" r=".9" style="fill:#c4b0ff;stroke:none"/></g><circle class="eye" cx="11.2" cy="14.3" r=".9"/><circle class="eye" cx="14.8" cy="14.3" r=".9"/>`
function cluster(agents, extra = '') {
  return `<button class="cluster ${extra}" aria-label="${agents.length} agents"><svg viewBox="0 0 26 26">${BOT}${agents.map((a, i) => arc(i, a.depth, a.state, `${a.title} · L${a.depth} · ${a.state}`)).join('')}</svg></button>`
}
function clusters(list, collapsed = false) {
  const seq = ordered(list); const groups = []
  for (let i = 0; i < seq.length; i += SLOTS) groups.push(seq.slice(i, i + SLOTS))
  if (collapsed) {
    const working = list.some(a => a.state === 'working')
    return `<span class="clusters" data-collapsed>${cluster(working ? [{ depth: 1, state: 'working', title: 'Agents working' }] : [], 'summary')}<button class="clusters-toggle" aria-expanded="false" title="Show agents">›</button></span>`
  }
  return `<span class="clusters">${groups.map(g => cluster(g)).join('')}<button class="clusters-toggle" aria-expanded="true" title="Hide agents">⌄</button></span>`
}

function agentRow(a, focus) {
  const level = `L${a.depth}`
  const now = a.state === 'working' ? `<div class="now"><b>Running</b> ${a.now} <code>${a.tool}</code></div>`
    : a.state === 'failed' ? `<div class="now error">${a.error || 'Agent stopped with an error.'}</div>`
    : `<div class="now report">${a.report}</div>`
  const meta = a.state === 'working' ? `<b>${a.elapsed}</b> so far<br>${a.tokens} tokens · ${a.tools} tool uses` : `<b>${a.elapsed}</b><br>${a.tokens} tokens · ${a.tools} tool uses`
  const actions = a.state === 'working' ? `<button>Show in transcript</button><button>Follow live</button>` : a.state === 'failed' ? `<button>Show in transcript</button><button>Copy error</button>` : `<button>Show in transcript</button><button>Open report</button>`
  return `<div class="agent" data-depth="${Math.min(a.depth, 3)}" ${focus ? 'data-focus' : ''}>${dot(a)}<div><div class="title">${a.title}<span class="lvl">${level}</span><span class="tag">${a.role}</span><span class="tag model"><i>✱</i>${a.model}</span><span class="tag">${a.effort}</span></div>${now}</div><div class="meta">${meta}</div><div class="actions">${actions}</div></div>`
}
function modal(list, focusId) {
  const c = counts(list); const depth = Math.max(...list.map(a => a.depth))
  const tokens = list.length > 10 ? '2.4M' : '843k'
  return `<div class="scrim"><section class="modal" role="dialog" aria-label="Agents">
    <header><h2>Agents</h2><small>This turn · ${list.length} agents · started 14 minutes ago</small><button class="x" aria-label="Close">×</button></header>
    <div class="strip"><span><span class="dot" data-state="working"></span>${c.working} working</span><span><span class="dot" data-state="done"></span>${c.done} done</span><span><span class="dot" data-state="failed"></span>${c.failed} failed</span><span>${tokens} tokens across agents</span><span>${depth} levels deep</span></div>
    <div class="filters"><button aria-pressed="true">All</button><button>Working</button><button>Done</button><button>Failed</button><span class="sp"></span><label>Fold finished families <i></i></label></div>
    <div class="tree">${list.map(a => agentRow(a, a.id === focusId)).join('')}
      <div class="section">Background commands</div>
      <div class="bg-row"><span class="dot" data-state="working"></span>Run experiment at six workers with reduced motion<small>2m 40s</small></div>
      <div class="bg-row"><span class="dot" data-state="done"></span>Wait for experiment run, summarize, confirm edits reverted<small>4m 02s</small></div>
    </div>
    <footer>Level shows which agent issued the call. Agents you start sit at L1.<span>Esc closes · click any cluster to open here</span></footer>
  </section></div>`
}

    <section class="conv">

function legend() {
  const one = (s) => `<span class="dot" data-state="${s}"></span>`
  const six = [
    { depth: 1, state: 'working', title: 'Slot 1' }, { depth: 1, state: 'done', title: 'Slot 2' }, { depth: 1, state: 'waiting', title: 'Slot 3' }, { depth: 1, state: 'failed', title: 'Slot 4' }, { depth: 1, state: 'working', title: 'Slot 5' }, { depth: 1, state: 'done', title: 'Slot 6' }]
  const depth = [
    { depth: 1, state: 'working', title: 'L1' }, { depth: 2, state: 'working', title: 'L2' }, { depth: 3, state: 'working', title: 'L3' }, { depth: 2, state: 'done', title: 'L2 done' }, { depth: 1, state: 'done', title: 'L1 done' }]
  const fam = ordered(base)
  return `<section class="board"><h2>Cluster vocabulary</h2><p>One bot per cluster, one arc per agent, six arcs per cluster, a seventh agent starts the next cluster. Arcs fill clockwise from the top in start order, with a parent's children right after it. Colour is state. Arc length is depth: a level 1 agent fills its slot, level 2 is shorter, level 3 and deeper shorter still.</p>
    <div class="legend">
      <div class="item"><div class="sw">${one('working')}</div><div>Working<small>Grape, slow breathe.</small></div></div>
      <div class="item"><div class="sw">${one('done')}</div><div>Done<small>Teal. Report is in the transcript and the modal.</small></div></div>
      <div class="item"><div class="sw">${one('waiting')}</div><div>Waiting on you<small>Amber. Asked a question or needs an approval.</small></div></div>
      <div class="item"><div class="sw">${one('failed')}</div><div>Failed<small>Pink. Error text in the modal. Stays until your next message.</small></div></div>
      <div class="item wide"><div class="cluster-row big">${cluster(six)}${cluster(depth)}${cluster(fam)}${clusters(base, true).replace('class="clusters"', 'class="clusters big"')}</div><div style="margin-top:10px">Left to right<small>Six level 1 agents in every state. Then depth by arc length: L1, L2, L3, an L2 that finished, an L1 that finished. Then the six agents from the main mockup as they fall into slots: audit done, analysis working, its two children and a grandchild, the second audit done. Last, the collapsed form: one bot with a single breathing arc while anything works, and the chevron to expand.</small></div></div>
      <div class="item wide"><div class="cluster-row">${clusters(many())}</div><div style="margin-top:10px">Thirty-four agents<small>Six clusters: five full and one with four. Each cluster is 30 pixels, so a research run with fifty agents takes nine clusters and about 360 pixels of title row, which is what the row has before it starts to crowd Find. Past that the clusters collapse to the summary bot and the modal carries the detail.</small></div></div>
    </div>
  </section>`
}

const root = document.getElementById('root')
if (state === 'legend') root.innerHTML = legend()
else root.innerHTML = frame(data, { modal: state.startsWith('modal'), focus: state === 'modal' ? 'a2b' : undefined, hidden: state === 'hidden' })
