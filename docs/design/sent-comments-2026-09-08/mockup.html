.conflict-choices small, .conflict-choices strong { font-size: 11px; font-weight: 800; }
.conflict-choices span { font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
.toast { position: fixed; z-index: 80; bottom: 30px; left: 50%; display: flex; max-width: 70vw; align-items: center; gap: 10px; border-radius: 999px; padding: 11px 20px; background: var(--surfaces-overlay); color: var(--surfaces-overlay-text); box-shadow: 0 16px 44px -10px color-mix(in srgb, var(--surfaces-window) 70%, transparent); font-size: 14px; font-weight: 700; animation: toast-in .38s cubic-bezier(.34,1.56,.64,1); }
.toast i { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--controls-primary-highlight); }
.drop-overlay { position: fixed; z-index: 90; inset: 24px; display: grid; place-items: center; border: 3px dashed var(--controls-positive); border-radius: 28px; background: color-mix(in srgb, var(--surfaces-window) 84%, transparent); color: var(--text); font-size: 22px; font-weight: 800; pointer-events: none; animation: pop-in .25s cubic-bezier(.34,1.56,.64,1); }
.boot-screen, .empty-welcome { display: grid; width: 100%; height: 100%; place-content: center; justify-items: center; gap: 16px; background: radial-gradient(900px 600px at 50% 20%, var(--surfaces-panel), var(--bg)); color: var(--dim); font-size: 16px; font-weight: 700; }
.empty-shell .empty-welcome { position: relative; z-index: 2; flex: 1; background: none; }
.empty-editor-island { min-width: 0; }
.empty-welcome h1 { margin: 6px 0 0; color: var(--text); font-size: calc(28px * var(--zoom, 1)); }
.empty-welcome p { margin: 0; color: var(--dim); font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .ambient-page, .ambient-layer { display: none !important; }
}

@media (max-width: 1200px) {
  .app-shell { padding-inline: 16px; }
  .topbar { margin-inline: -16px; gap: 10px; }
  .topbar .pending-status, .topbar .engine-status-label { display: none; }
  .editor-scroll { --document-padding-inline: 30px; }
}

/* Theme panel (PRD §6.13): floating, movable, resizable, never dims the app. */
.theme-panel { position: fixed; z-index: 55; display: flex; flex-direction: column; font-size: calc(16px * var(--zoom, 1)); border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 24px 60px -18px var(--shadow); animation: pop-in .24s cubic-bezier(.34,1.56,.64,1); }
.theme-panel-header { display: flex; flex: none; align-items: center; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding: 8px 10px; cursor: grab; user-select: none; }
.theme-panel-header:active { cursor: grabbing; }
.theme-panel-grip { border: 0; border-radius: 8px; padding: 2px 4px; background: transparent; color: var(--muted); font-size: calc(12px * var(--zoom, 1)); letter-spacing: -2px; cursor: grab; }
.theme-panel-grip:focus-visible { outline: 2px solid var(--controls-focus); }
.theme-panel-name { min-width: 0; flex: 1; border: 0; border-radius: 8px; padding: 4px 8px; background: transparent; color: var(--text); font-family: inherit; font-size: calc(15px * var(--zoom, 1)); font-weight: 800; }
input.theme-panel-name:hover, input.theme-panel-name:focus { background: var(--card-2); outline: none; }
.theme-panel-pick { display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px 0; }
.theme-panel-pick select, .theme-row select, .theme-row input[list] { min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 4px 8px; background: var(--card-2); color: var(--text); font-family: inherit; font-size: calc(13px * var(--zoom, 1)); font-weight: 700; }
.theme-panel-pick select:first-child { flex: 1; }
.theme-delete.armed { color: var(--controls-danger); background: color-mix(in srgb, var(--controls-danger) 15%, transparent); }
.theme-panel-note { margin: 6px 10px 0; border-radius: 10px; padding: 7px 10px; background: var(--card-2); color: var(--dim); font-size: calc(12px * var(--zoom, 1)); font-weight: 600; line-height: 1.45; }
.theme-panel-scroll { min-height: 0; flex: 1; overflow: auto; padding: 8px 10px 14px; }
.theme-group { margin-top: 6px; }
.theme-group-title { display: flex; width: 100%; align-items: center; gap: 6px; border: 0; border-radius: 9px; padding: 6px 8px; background: transparent; color: var(--dim); font-family: inherit; font-size: calc(13px * var(--zoom, 1)); font-weight: 800; text-align: left; cursor: pointer; }
.theme-group-title:hover { background: var(--card-2); color: var(--text); }
.theme-group-note { margin: 0 8px 4px; color: var(--muted); font-size: calc(11px * var(--zoom, 1)); font-weight: 600; line-height: 1.4; }
.theme-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 8px; border-radius: 9px; padding: 5px 8px; transition: background .25s; }
.theme-row:hover { background: var(--card-2); }
.theme-row.flash { background: color-mix(in srgb, var(--controls-selected) 22%, transparent); }
.theme-row label { min-width: 0; color: var(--body); font-size: calc(13px * var(--zoom, 1)); font-weight: 700; }
.theme-row.is-default label { color: var(--dim); font-weight: 600; }
/* Every row states its exact targets in plain sight (no tooltip needed). */
.theme-row-target { grid-column: 1 / -1; margin: -2px 0 2px; color: var(--muted); font-size: calc(11px * var(--zoom, 1)); font-weight: 600; line-height: 1.35; }
.theme-row-control { display: flex; align-items: center; gap: 6px; }
.theme-row input[type="color"] { width: 30px; height: 24px; border: 1px solid var(--line); border-radius: 7px; padding: 0; background: transparent; cursor: pointer; }
.theme-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
.theme-row input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 5px; }
.theme-row input[type="range"] { width: 110px; accent-color: var(--controls-primary); }
.theme-row input[list] { width: 150px; }
.theme-hex { min-width: 58px; color: var(--muted); font-family: var(--font-code), monospace; font-size: calc(11px * var(--zoom, 1)); }
.theme-row-mark, .theme-row-problem { color: var(--muted); font-size: calc(11px * var(--zoom, 1)); font-weight: 700; }
.theme-row-problem { display: grid; width: 18px; height: 18px; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--controls-warning) 25%, transparent); color: var(--controls-warning); cursor: help; }
.theme-row-default { padding: 2px 8px; font-size: calc(11px * var(--zoom, 1)); }
.theme-panel-resize { position: absolute; right: 2px; bottom: 2px; width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; cursor: nwse-resize; touch-action: none; }
.theme-panel-resize::before { content: ''; position: absolute; right: 5px; bottom: 5px; width: 10px; height: 10px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); border-radius: 1px; }
.theme-panel-resize:focus-visible { outline: 2px solid var(--controls-focus); }
/* Chrome strip: the colors the open document cannot show. */
.theme-chrome { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 8px; border-radius: 14px; padding: 10px 12px; }
.theme-chrome .agent-avatar { width: 26px; height: 26px; font-size: calc(11px * var(--zoom, 1)); }
.theme-sample-chip { border-radius: 999px; padding: 2px 9px; font-size: calc(11px * var(--zoom, 1)); font-weight: 700; }
.theme-sample-inset { background: var(--card-2); color: var(--dim); }
.theme-sample-overlay { background: var(--surfaces-overlay); color: var(--surfaces-overlay-text); font-weight: 800; }
.theme-sample-field { border: 1px solid var(--line); background: var(--surfaces-field); color: var(--body); }
.theme-sample-interface-primary { color: var(--text); font-weight: 800; }
.theme-sample-interface-body { color: var(--body); }
.theme-sample-interface-secondary { color: var(--dim); }
.theme-sample-interface-muted { color: var(--muted); }
.theme-sample-border { width: 28px; height: 0; border-top: 2px solid var(--line); }
.theme-sample-primary { background: var(--controls-primary); color: var(--controls-primary-text); font-weight: 800; }
.theme-sample-primary-highlight { border: 2px solid var(--controls-primary-highlight); color: var(--controls-primary-highlight); font-weight: 800; }
.theme-sample-selected { background: var(--selection-background); color: var(--selection-text); }
.theme-sample-positive { background: var(--controls-positive); color: var(--controls-positive-text); font-weight: 800; }
.theme-sample-warning { color: var(--controls-warning); background: color-mix(in srgb, var(--controls-warning) 15%, transparent); font-weight: 800; }
.theme-sample-danger { background: var(--controls-danger); color: var(--controls-danger-text); font-weight: 800; }
.theme-sample-focus { outline: 3px solid color-mix(in srgb, var(--controls-focus) 75%, var(--interface-primary)); outline-offset: 1px; color: var(--dim); }
.theme-sample-added { background: var(--changes-added-background); color: var(--changes-added-tint); font-weight: 700; }
.theme-sample-removed { background: var(--changes-removed-background); color: var(--changes-removed-tint); text-decoration: line-through; }
/* Hovering a panel row outlines exactly what it controls in the live app and the chrome strip. */
[data-theme-highlight] .editor-island .ProseMirror :is(h1, h2, h3, h4, h5, h6, strong, em, code, a, p, pre, blockquote, li, hr, table, th), [data-theme-highlight] .theme-chrome [data-sample] { transition: outline-color .15s; }
.app-shell[data-theme-highlight="document-headings"] .editor-island .ProseMirror :is(h1, h2),
.app-shell[data-theme-highlight="document-small-headings"] .editor-island .ProseMirror :is(h3, h4, h5, h6),
.app-shell[data-theme-highlight="document-bold"] .editor-island .ProseMirror strong,
.app-shell[data-theme-highlight="document-italic"] .editor-island .ProseMirror em,
.app-shell[data-theme-highlight="document-code"] .editor-island .ProseMirror :is(code, pre),
.app-shell[data-theme-highlight="document-link"] .editor-island .ProseMirror a,
.app-shell[data-theme-highlight="document-body"] .editor-island .ProseMirror p,
.app-shell[data-theme-highlight="document-quote"] .editor-island .ProseMirror :is(blockquote, ul, ol),
.app-shell[data-theme-highlight="document-table-heading"] .editor-island .ProseMirror th,
.app-shell[data-theme-highlight="surfaces-border"] .editor-island .ProseMirror hr,
.app-shell[data-theme-highlight="visuals-table-background"] :is(.strata-table-block, .strata-prosemirror table),
.app-shell[data-theme-highlight="visuals-table-background-end"] :is(.strata-table-block, .strata-prosemirror table),
.app-shell[data-theme-highlight="visuals-table-toolbar"] .strata-table-toolbar,
.app-shell[data-theme-highlight="visuals-table-header"] :is(.strata-table-block th, .strata-prosemirror th, .strata-table-focus-row dt),
.app-shell[data-theme-highlight="visuals-table-border"] :is(.strata-table-block, .strata-prosemirror table, .strata-table-focus-row),
.app-shell[data-theme-highlight="visuals-table-hover"] :is(.strata-table-block, .strata-prosemirror) tbody tr,
.app-shell[data-theme-highlight="surfaces-transcript"] :is(.conversation-messages, .editor-scroll),
.app-shell[data-theme-highlight="surfaces-transcript-border"] :is(.conversation-messages, .editor-scroll),
.app-shell[data-theme-highlight="surfaces-transcript-shadow"] :is(.conversation-messages, .editor-scroll),
.app-shell[data-theme-highlight="surfaces-user-message"] .conversation-message.user,
.app-shell[data-theme-highlight="surfaces-tool-call"] :is(.conversation-work-entry, .conversation-work-toggle, .conversation-tool, .conversation-changed-files),
.app-shell[data-theme-highlight="surfaces-code"] .editor-island .ProseMirror :is(pre, code),
.app-shell[data-theme-highlight="surfaces-field"] :is(textarea:not(.chat-composer textarea), .reply-box input, .chat-composer-box),
.app-shell[data-theme-highlight="surfaces-overlay"] :is(.selection-menu, .toast),
.app-shell[data-theme-highlight="fonts-text"] .editor-island .ProseMirror,
.app-shell[data-theme-highlight="fonts-code"] .editor-island .ProseMirror :is(pre, code),
.app-shell[data-theme-highlight="interface-primary"] .panel-heading h2,
.app-shell[data-theme-highlight="interface-secondary"] :is(.tab, .file-row > button:first-child),
.app-shell[data-theme-highlight="interface-muted"] kbd,
.app-shell[data-theme-highlight="controls-primary"] :is(.primary-button, .reply-box button, .resizer span),
.app-shell[data-theme-highlight="controls-primary-highlight"] :is(.send-button, .copy-button),
.app-shell[data-theme-highlight="controls-selected"] :is(.tab-badge, .file-count, .file-row.active, .source-toggle.active, .agent-icon.holds-lead),
.app-shell[data-theme-highlight="controls-positive"] :is(.keep-button, .save-button[data-dirty="true"], .add-folder, .resolve-button),
.app-shell[data-theme-highlight="controls-warning"] :is(.banner-warning, .tab-dirty-dot, .pending-status[data-unsaved="true"], .state-pending, .chip-question),
.app-shell[data-theme-highlight="controls-danger"] :is(.revert-button, .outline-danger-button, .danger-button),
.app-shell[data-theme-highlight="changes-added"] :is(.strata-review-change, .strata-suggestion, .strata-source-review-insertion, .snippet-added),
.app-shell[data-theme-highlight="changes-removed"] :is(.strata-review-deletion, .strata-source-suggestion-deletion, .snippet-removed),
.app-shell[data-theme-highlight="effects-primary"] [data-effect-slot="primary"],
.app-shell[data-theme-highlight="effects-secondary"] [data-effect-slot="secondary"],
.app-shell[data-theme-highlight="effects-tertiary"] [data-effect-slot="tertiary"],
.app-shell[data-theme-highlight="effects-detail-1"] [data-effect-slot="detail-1"],
.app-shell[data-theme-highlight="effects-detail-2"] [data-effect-slot="detail-2"],
.app-shell[data-theme-highlight="effects-background"] .ambient-page,
.app-shell[data-theme-highlight="effects-panels"] .ambient-layer,
[data-theme-highlight] .theme-chrome [data-sample-active="true"] { outline: 2px solid var(--controls-primary); outline-offset: 2px; border-radius: 6px; }
.app-shell[data-theme-highlight="surfaces-panel"] :is(.island, .theme-panel, .context-menu, .modal), .app-shell[data-theme-highlight="surfaces-border"] .island { outline: 2px solid var(--controls-primary); outline-offset: -2px; }
.app-shell[data-theme-highlight="surfaces-window"] { outline: 3px solid var(--controls-primary); outline-offset: -3px; }

/* Crash containment (docs/crash-hardening-plan.md §3): the fallback card a
   boundary renders in place of a failed region, and the hidden test probe. */
.boundary-card { display: grid; width: 100%; height: 100%; min-height: 120px; place-content: center; justify-items: center; gap: 14px; padding: 24px; background: var(--surfaces-panel); color: var(--interface-body); font-size: 15px; font-weight: 700; text-align: center; }
.boundary-card p { max-width: 42ch; margin: 0; }
.boundary-card button { border: 0; border-radius: 999px; padding: 6px 22px; background: var(--controls-primary); color: var(--controls-primary-text); font-size: 14px; font-weight: 800; cursor: pointer; transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
.boundary-card button:hover { transform: scale(1.08); }
.crash-probe { position: fixed; bottom: 0; left: 0; width: 8px; height: 8px; padding: 0; border: 0; opacity: 0.01; }

/* Find bar (PRD §6.1): every match marked, the current one distinct, in both views. */
.find-bar { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 8px 14px; animation: slide-a .2s ease-out; }
.find-bar input { min-width: 120px; flex: 0 1 320px; border: 2px solid var(--line); border-radius: 10px; outline: none; padding: 5px 10px; background: var(--surfaces-field); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; }
.find-bar input:focus { border-color: var(--controls-selected); }
.find-bar .find-count { min-width: 72px; color: var(--dim); font-size: 12px; font-weight: 700; }
.find-bar button { border: 0; border-radius: 999px; padding: 3px 10px; background: transparent; color: var(--dim); font-size: 13px; font-weight: 800; cursor: pointer; }
.find-bar button:hover, .find-bar button:focus-visible { background: var(--card-2); color: var(--text); outline: none; }
.strata-find-match { border-radius: 4px; background: color-mix(in srgb, var(--controls-warning) 38%, transparent); }
.strata-find-current { background: var(--controls-selected); color: var(--controls-selected-text); box-shadow: 0 0 0 2px var(--controls-selected); }
.strata-source-find { position: absolute; inset: 0; color: transparent; -webkit-text-fill-color: transparent; }
.strata-source-find .strata-find-match { -webkit-text-fill-color: transparent; }

/* Error toasts stay until dismissed (PRD §6.9). */
.toast-error { background: var(--controls-danger); color: var(--controls-danger-text); }
.toast-error i { background: var(--controls-danger-text); }
.toast-error button { width: 22px; height: 22px; flex: none; margin-left: 4px; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--controls-danger-text) 18%, transparent); color: inherit; font-size: 14px; font-weight: 800; line-height: 1; cursor: pointer; }
.toast-error button:hover { background: color-mix(in srgb, var(--controls-danger-text) 32%, transparent); }

/* Thread replies: a growing text box, Enter sends; quiet times on each entry. */
.reply-box textarea { min-width: 0; max-height: 180px; flex: 1; border: 2px solid var(--line); border-radius: 12px; outline: none; padding: 8px 12px; background: var(--surfaces-field); color: var(--text); font-family: inherit; line-height: 1.4; resize: none; field-sizing: content; }
.reply-box textarea:focus { border-color: var(--controls-selected); }
.thread-panel .reply-box textarea { font-size: calc(21px * var(--zoom, 1)); }
.thread-time { margin-left: 8px; color: var(--muted); font-size: calc(11px * var(--zoom, 1)); font-weight: 600; }
.thread-panel-header .thread-time { margin-right: auto; }
.thread-panel-actions { display: flex; flex: none; justify-content: flex-end; gap: 8px; margin-top: 10px; }

/* Decision annotations reuse the existing forms and thread surface. */
.decision-options { display: grid; gap: 6px; margin-top: 9px; border: 0; padding: 0; }
.decision-options label, .rail-decision-form label { display: grid; gap: 3px; color: var(--dim); font-size: calc(11px * var(--zoom, 1)); font-weight: 800; }
.decision-options input, .rail-decision-form :is(input, textarea, select), .decision-answer-form > input { min-width: 0; width: 100%; border: 2px solid var(--line); border-radius: 10px; outline: none; padding: 6px 9px; background: var(--surfaces-field); color: var(--text); font: inherit; }
.decision-options input:focus, .rail-decision-form :is(input, textarea, select):focus, .decision-answer-form > input:focus { border-color: var(--controls-selected); }
.decision-other-note { color: var(--muted); font-size: calc(11px * var(--zoom, 1)); }
.decision-answer-form { display: grid; flex: none; gap: 7px; margin: 10px 0 4px; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.decision-answer-form legend { padding: 0 4px; color: var(--dim); font-size: calc(12px * var(--zoom, 1)); font-weight: 800; }
.decision-answer-form label { display: flex; align-items: center; gap: 7px; color: var(--body); font-size: calc(14px * var(--zoom, 1)); cursor: pointer; }
.decision-answer-form label input { accent-color: var(--controls-selected); }
.decision-answer-form button { justify-self: end; }
.decision-answer-form button:disabled { opacity: .45; cursor: not-allowed; }
.annotation-filter { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 7px; }
.annotation-filter button { border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; background: transparent; color: var(--dim); font: inherit; font-size: calc(10px * var(--zoom, 1)); font-weight: 800; cursor: pointer; }
.annotation-filter button.active { border-color: var(--controls-selected); background: color-mix(in srgb, var(--controls-selected) 18%, transparent); color: var(--controls-selected-tint); }
.new-decision { margin: 0 0 7px; }
.rail-decision-form { display: grid; gap: 7px; margin-bottom: 9px; border: 1px solid var(--line); border-radius: 13px; padding: 9px; background: var(--card-2); }
.rail-decision-form textarea { min-height: 54px; resize: vertical; }
.rail-decision-form > div { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
.rail-decision-form small { color: var(--muted); }

/* Explorer folder menu and the empty Attached panel. */
.context-menu button.menu-danger:hover, .context-menu button.menu-danger:focus-visible { color: var(--controls-danger); background: color-mix(in srgb, var(--controls-danger) 15%, transparent); }
.agent-prompt { display: block; margin: 8px auto 0; }

/* ---- Usability round 2 (batch C) ---- */
/* The link and image form (§2.8): fixed beside the selection, above the pill. */
.editor-popover { position: fixed; z-index: 46; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card); box-shadow: 0 20px 50px -14px color-mix(in srgb, var(--surfaces-window) 70%, transparent); animation: pop-in .24s cubic-bezier(.34,1.56,.64,1); }
.editor-popover-title { color: var(--controls-primary); font-size: 13px; font-weight: 800; }
.editor-popover label { display: grid; gap: 3px; color: var(--dim); font-size: 12px; font-weight: 700; }
.editor-popover input { width: 100%; border: 2px solid var(--line); border-radius: 10px; outline: none; padding: 7px 10px; background: var(--surfaces-field); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500; }
.editor-popover input:focus { border-color: var(--controls-primary); }
.editor-popover-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
/* A note with a button (§5.4). */
.toast-action { flex: none; margin-left: 6px; border: 0; border-radius: 999px; padding: 4px 12px; background: color-mix(in srgb, var(--surfaces-overlay-text) 16%, transparent); color: inherit; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
.toast-action:hover { background: color-mix(in srgb, var(--surfaces-overlay-text) 28%, transparent); }
/* The right-click pill's edit row (§5.15) shares the spelling column's layout. */
.edit-options { display: flex; flex-basis: 100%; flex-wrap: wrap; gap: 1px; margin-top: 5px; border-top: 1px solid color-mix(in srgb, var(--surfaces-overlay-text) 16%, transparent); padding-top: 5px; }
.selection-menu .edit-options button { border-radius: 10px; padding: 6px 12px; font-weight: 700; }
.selection-menu .edit-options button:hover { transform: none; }
/* Why the formatting tools are off (§5.13). */
.toolbar-hint { flex: 1 1 0; min-width: 0; margin-left: 8px; color: var(--muted); font-size: calc(12px * var(--zoom, 1)); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-menu > div button:focus-visible, .heading-menu > div button:focus-visible { outline: 2px solid var(--controls-focus, var(--controls-primary)); outline-offset: -2px; background: var(--card-2); color: var(--text); }
/* The shortcut sheet (§5.12). */
.shortcut-sheet { width: min(760px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow: auto; }
.shortcut-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 28px; margin-top: 8px; }
.shortcut-groups h3 { margin: 0 0 6px; color: var(--controls-primary); font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.shortcut-groups dl { margin: 0; }
.shortcut-groups dl > div { display: grid; grid-template-columns: minmax(150px, auto) 1fr; gap: 12px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.shortcut-groups dt { margin: 0; }
.shortcut-groups dt kbd { color: var(--text); font-size: 12px; font-weight: 600; }
.shortcut-groups dd { margin: 0; color: var(--body); font-size: 13px; font-weight: 500; }
/* Explorer recents and file dialogs (§5.10). */
.recents { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.recents h3 { margin: 0 0 2px 10px; color: var(--muted); font-size: calc(11px * var(--zoom, 1)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.recent-row { margin-left: 0; }
.file-name-field { display: grid; gap: 4px; margin: 10px 0 6px; color: var(--dim); font-size: 12px; font-weight: 700; }
.file-name-field input { width: 100%; border: 2px solid var(--line); border-radius: 12px; outline: none; padding: 9px 12px; background: var(--surfaces-field); color: var(--text); font-family: inherit; font-size: 15px; font-weight: 500; }
.file-name-field input:focus { border-color: var(--controls-primary); }
/* Save history paging (§5.16). */
.show-older { display: block; margin: 4px auto 0; }

/* ---- Structured reading (docs/design/structured-reading/dense-review-faithful-shell.html) ---- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.border-soft, .app-shell { --border-soft: color-mix(in srgb, var(--surfaces-border) 54%, transparent); --mono: var(--font-code), "JetBrains Mono", monospace; }

/* Contents: the walkthrough card, then the section route. */
.contents { display: flex; min-height: 0; flex: 1; flex-direction: column; padding: 14px 13px 8px; }
.contents-scroll { min-height: 0; flex: 1; overflow: auto; padding: 0 2px 10px; }
.contents-title { display: flex; flex-direction: column; gap: 2px; width: 100%; margin: 0 0 6px; border: 1px solid transparent; border-radius: 12px; padding: 8px 9px; background: transparent; color: var(--dim); text-align: left; cursor: pointer; }
.contents-title:hover { background: var(--surfaces-field); }
.contents-title span { color: var(--muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); letter-spacing: .1em; text-transform: uppercase; }
.contents-title strong { overflow: hidden; color: var(--text); font-size: calc(13px * var(--zoom, 1)); text-overflow: ellipsis; white-space: nowrap; }
.contents-title.active { border-color: color-mix(in srgb, var(--controls-primary) 43%, transparent); background: color-mix(in srgb, var(--controls-primary) 14%, transparent); }
.contents-empty { padding: 28px 16px; color: var(--dim); text-align: center; font-size: calc(13px * var(--zoom, 1)); font-weight: 700; }
.walk-card { flex: none; margin: 0 2px 12px; border: 1px solid color-mix(in srgb, var(--controls-primary) 45%, transparent); border-radius: 17px; padding: 13px; background: linear-gradient(145deg, color-mix(in srgb, var(--surfaces-inset) 72%, transparent), color-mix(in srgb, var(--surfaces-window) 82%, transparent)); box-shadow: inset 0 1px color-mix(in srgb, var(--interface-primary) 4%, transparent); }
.walk-kicker { display: flex; align-items: center; gap: 8px; color: var(--muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.walk-kicker b { margin-left: auto; color: var(--document-headings); font-size: calc(11px * var(--zoom, 1)); font-weight: 500; }
.walk-title { margin: 8px 0 2px; color: var(--text); font-size: calc(17px * var(--zoom, 1)); font-weight: 800; line-height: 1.12; overflow-wrap: anywhere; }
.walk-preview { display: -webkit-box; margin: 0; overflow: hidden; color: var(--dim); font-size: calc(11px * var(--zoom, 1)); font-weight: 600; line-height: 1.4; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.progress-track { height: 7px; margin: 12px 0 9px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--surfaces-window) 80%, var(--surfaces-panel)); }
.progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--controls-primary), var(--controls-primary-highlight), var(--controls-warning)); transition: width .26s ease; }
.walk-actions { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 6px; }
.walk-actions .walk-depth { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
.walk-actions > button { border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; background: color-mix(in srgb, var(--surfaces-window) 52%, transparent); color: var(--dim); font-size: calc(10px * var(--zoom, 1)); font-weight: 800; cursor: pointer; }
.walk-actions > button:hover:not(:disabled) { border-color: var(--controls-primary); color: var(--text); }
.walk-actions > button:disabled { opacity: .4; cursor: default; }
.walk-actions .leave { grid-column: 3; grid-row: 1; justify-self: end; color: var(--muted); }
.walk-depth { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: color-mix(in srgb, var(--surfaces-window) 70%, transparent); }
.walk-depth button { border: 0; border-radius: 999px; padding: 3px 8px; background: transparent; color: var(--muted); font-size: calc(9px * var(--zoom, 1)); font-weight: 800; cursor: pointer; }
.walk-depth button[aria-checked="true"] { background: var(--surfaces-inset); color: var(--document-headings); }
.outline-label { display: flex; align-items: center; gap: 8px; margin: 8px 6px 5px; color: var(--muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.outline-count { margin-left: auto; color: var(--interface-muted); }
.contents-tree, .outline-sub { margin: 0; padding: 0; list-style: none; }
.outline-row-wrap { display: flex; align-items: center; gap: 3px; }
.outline-include { display: grid; width: 16px; height: 16px; flex: none; margin: 0 0 0 1px; place-items: center; border: 1px solid color-mix(in srgb, var(--controls-primary) 72%, transparent); border-radius: 999px; padding: 0; background: transparent; color: var(--controls-primary); font: 800 12px/1 var(--font-text), sans-serif; cursor: pointer; opacity: .78; }
.outline-include[data-included="true"] { background: color-mix(in srgb, var(--controls-primary) 78%, var(--surfaces-field)); color: var(--controls-primary-text); }
.outline-include:hover, .outline-include:focus-visible { opacity: 1; transform: scale(1.08); }
.outline-row { display: grid; min-width: 0; flex: 1; grid-template-columns: minmax(0, 1fr) 18px; align-items: center; gap: 7px; margin: 2px 0; border: 1px solid transparent; border-radius: 11px; padding: 7px 8px; background: transparent; color: var(--muted); text-align: left; }
.outline-row-main { display: grid; min-width: 0; grid-template-columns: 25px minmax(0, 1fr) auto; align-items: center; gap: 7px; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.outline-drafts { display: inline-grid; min-width: 17px; height: 17px; place-items: center; border: 1px dashed var(--people-you); border-radius: 999px; color: var(--people-you); font-size: calc(9px * var(--zoom, 1)); font-weight: 900; }
.outline-row:hover, .outline-row:focus-within { background: var(--surfaces-field); color: var(--dim); }
.outline-row.active { border-color: color-mix(in srgb, var(--controls-primary) 43%, transparent); background: linear-gradient(100deg, color-mix(in srgb, var(--controls-primary) 20%, transparent), color-mix(in srgb, var(--surfaces-field) 42%, transparent)); color: var(--text); }
.outline-num { color: var(--interface-muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; }
.outline-text { min-width: 0; overflow: hidden; font-size: calc(12px * var(--zoom, 1)); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.outline-row.active .outline-text { overflow: visible; white-space: normal; overflow-wrap: anywhere; }
.outline-state { display: grid; width: 16px; height: 16px; place-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: transparent; color: transparent; font: inherit; font-size: 9px; cursor: pointer; }
.outline-state i { font-style: normal; }
.outline-state:hover, .outline-state:focus-visible { border-color: var(--controls-positive); background: color-mix(in srgb, var(--controls-positive) 10%, transparent); color: var(--controls-positive); transform: scale(1.08); }
.outline-state[data-state="reviewed"] { border-color: var(--controls-positive); background: color-mix(in srgb, var(--controls-positive) 13%, transparent); color: var(--controls-positive); }
.outline-state[data-state="revisit"] { border-color: var(--controls-warning); background: color-mix(in srgb, var(--controls-warning) 13%, transparent); color: var(--controls-warning); }
.outline-state-placeholder { width: 16px; height: 16px; }
.outline-row.nested { margin: 1px 0; padding: 4px 8px; }
.outline-row.nested .outline-row-main { grid-template-columns: 12px minmax(0, 1fr); }
.outline-row.nested .outline-num { text-align: center; }
.outline-row.nested .outline-text { font-size: calc(11px * var(--zoom, 1)); font-weight: 600; }
.outline-sub { margin: 0 0 4px 29px; border-left: 1px solid var(--border-soft); padding: 1px 0 2px 5px; }
.outline-disclosure { display: grid; width: 20px; height: 20px; flex: none; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
.outline-disclosure:hover { background: var(--surfaces-field); color: var(--text); }
.walkthrough-excluded > .outline-row-wrap > .outline-row { opacity: .56; }

/* The center-bottom walkthrough bar. */
.walkbar { position: absolute; z-index: 12; right: 24px; bottom: 22px; left: 24px; display: grid; grid-template-columns: auto minmax(180px, 1fr) auto; align-items: center; gap: 12px; border: 1px solid color-mix(in srgb, var(--controls-primary) 52%, transparent); border-radius: 18px; padding: 10px 12px; background: color-mix(in srgb, var(--surfaces-panel) 94%, transparent); box-shadow: 0 20px 52px color-mix(in srgb, var(--surfaces-window) 52%, transparent); backdrop-filter: blur(18px); }
.walkbar button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; background: var(--surfaces-field); color: var(--dim); font-size: calc(10px * var(--zoom, 1)); font-weight: 800; cursor: pointer; }
.walkbar button:hover:not(:disabled) { border-color: var(--controls-primary); color: var(--text); }
.walkbar button:disabled { opacity: .4; cursor: default; }
.walkbar-nav { display: flex; gap: 6px; }
.walkbar-nav button { min-width: 32px; }
.walkbar-center { min-width: 0; }
.walkbar-title { display: flex; min-width: 0; align-items: baseline; gap: 8px; color: var(--text); font-size: calc(11px * var(--zoom, 1)); font-weight: 800; }
.walkbar-title > span:first-child { flex: none; color: var(--interface-muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; }
.walkbar-heading { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.walkbar .progress-track { height: 5px; margin: 5px 0 0; }
.state-actions { display: flex; gap: 6px; }
.state-actions .reviewed[aria-pressed="true"] { border-color: var(--controls-positive); background: color-mix(in srgb, var(--controls-positive) 12%, transparent); color: var(--controls-positive); }
.state-actions .revisit[aria-pressed="true"] { border-color: var(--controls-warning); background: color-mix(in srgb, var(--controls-warning) 12%, transparent); color: var(--controls-warning); }
.editor-scroll[data-walkthrough="true"] { padding-bottom: 132px; }

/* Document hierarchy: title and lede, numbered primary sections, quieter deeper headings. */
.prosemirror-host .ProseMirror { counter-reset: strata-section; }
.prosemirror-host .ProseMirror h1 { margin: 0 0 8px; font-size: calc(38px * var(--zoom, 1)); line-height: 1.05; }
.strata-fold-heading:has(> h1) { margin-bottom: 8px; }
.prosemirror-host .ProseMirror > .strata-fold-heading:has(> h1) + p { margin-bottom: 24px; font-size: calc(19px * var(--zoom, 1)); line-height: 1.55; }
.strata-fold-heading:has(> h2) { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 13px; align-items: center; margin: 46px 0 16px; border-bottom: 1px solid var(--border-soft); padding-bottom: 14px; counter-increment: strata-section; }
.strata-fold-heading:has(> h2)::before { grid-column: 1; grid-row: 1 / span 2; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid color-mix(in srgb, var(--controls-primary) 55%, var(--line)); border-radius: 14px; background: linear-gradient(145deg, color-mix(in srgb, var(--controls-primary) 32%, var(--surfaces-inset)), var(--surfaces-panel)); color: var(--document-headings); font-family: var(--mono); font-size: calc(12px * var(--zoom, 1)); font-weight: 500; content: counter(strata-section, decimal-leading-zero); user-select: none; }
.prosemirror-host .ProseMirror .strata-fold-heading:has(> h2) > h2 { grid-column: 2; grid-row: 1; margin: 0; font-size: calc(25px * var(--zoom, 1)); line-height: 1.15; }
.strata-fold-heading:has(> h2) > .strata-fold-toggle { grid-column: 3; grid-row: 1; }
.strata-fold-heading:has(> h2) > .strata-fold-hidden-status { grid-column: 2; grid-row: 2; margin: 2px 0 0; }
.strata-fold-heading:has(> h2).is-folded { margin-bottom: 8px; }
.prosemirror-host .ProseMirror h3 { margin: 30px 0 10px; font-size: calc(20px * var(--zoom, 1)); font-weight: 800; }
.prosemirror-host .ProseMirror h4 { margin: 24px 0 8px; font-size: calc(17px * var(--zoom, 1)); font-weight: 800; letter-spacing: .01em; }
.prosemirror-host .ProseMirror h5, .prosemirror-host .ProseMirror h6 { margin: 20px 0 6px; font-size: calc(15px * var(--zoom, 1)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.prosemirror-host .ProseMirror hr { margin: 34px 0; border-top: 1px solid var(--border-soft); }
.strata-mermaid-canvas svg .cluster rect, .strata-mermaid-canvas svg .cluster polygon { fill: color-mix(in srgb, var(--surfaces-inset) 45%, transparent) !important; stroke: var(--line) !important; }
.strata-mermaid-canvas svg .cluster-label text, .strata-mermaid-canvas svg .cluster text { fill: var(--document-small-headings) !important; }
.strata-mermaid-canvas svg .edgeLabel rect, .strata-mermaid-canvas svg .labelBkg, .strata-mermaid-canvas svg .edgeLabel .label rect { fill: var(--surfaces-panel) !important; opacity: 1; }
.strata-mermaid-canvas svg .edgeLabel, .strata-mermaid-canvas svg .edgeLabel span { background: var(--surfaces-panel) !important; }
.strata-mermaid-canvas svg .marker, .strata-mermaid-canvas svg marker path { fill: var(--controls-primary) !important; stroke: var(--controls-primary) !important; }
.strata-mermaid-canvas svg .edgePath path, .strata-mermaid-canvas svg .flowchart-link { stroke: var(--controls-primary) !important; }
.strata-mermaid-canvas svg { background: transparent !important; }

/* Tables: a composed header, a finished default view, and card treatments for the derived views. */
.strata-prosemirror table { background: var(--visuals-table-fill); width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--visuals-table-border); border-radius: 12px; overflow: hidden; }
.strata-prosemirror th, .strata-prosemirror td { border-right: 1px solid var(--visuals-table-border); border-bottom: 1px solid var(--visuals-table-border); padding: 8px 12px; text-align: left; }

.strata-table-block { position: relative; margin: 22px 0; overflow: hidden; border: 1px solid var(--visuals-table-border); border-radius: 19px; background: var(--visuals-table-fill); box-shadow: 0 14px 34px -28px color-mix(in srgb, var(--surfaces-window) 85%, transparent); }
.strata-table-toolbar { background: var(--visuals-table-toolbar); display: flex; flex-direction: column; border-bottom: 1px solid var(--visuals-table-border); white-space: normal; }
.strata-table-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-height: 50px; padding: 9px 13px; }

.strata-table-modes { display: flex; gap: 2px; margin-left: auto; border: 1px solid var(--visuals-table-border); border-radius: 999px; padding: 3px; background: var(--visuals-table-toolbar); }

.strata-table-modes button[aria-pressed="true"] { background: var(--visuals-table-header); color: var(--interface-muted); }
.strata-table-actions { display: flex; gap: 5px; }
.strata-table-action { border: 1px solid var(--visuals-table-border); border-radius: 9px; padding: 6px 9px; background: transparent; color: var(--dim); font: 800 calc(10px * var(--zoom, 1)) var(--font-text), sans-serif; cursor: pointer; }
.strata-table-action:hover { border-color: var(--controls-primary); color: var(--text); }
.strata-table-action[aria-pressed="true"] { border-color: color-mix(in srgb, var(--controls-primary) 70%, transparent); background: color-mix(in srgb, var(--controls-primary) 14%, transparent); color: var(--controls-primary-tint); }
.strata-table-head button:focus-visible, .strata-table-utilities :is(button, select, input, summary):focus-visible { outline: 2px solid var(--controls-focus); outline-offset: 1px; }
.strata-table-utilities { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; border-top: 1px solid var(--visuals-table-border); padding: 6px 13px 8px; background: var(--visuals-table-toolbar); }

.strata-table-secondary, .strata-table-secondary-collapsed, .strata-table-discussion, .strata-table-width { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.strata-table-utilities :is(button, select, input, summary), .strata-table-secondary-collapsed :is(button, select, input, summary) { min-height: 26px; border: 1px solid transparent; border-radius: 8px; padding: 3px 8px; background: color-mix(in srgb, var(--surfaces-field) 75%, transparent); color: var(--dim); font: 700 calc(10px * var(--zoom, 1)) var(--font-text), sans-serif; line-height: 1.2; }
.strata-table-utilities :is(button, summary), .strata-table-secondary-collapsed :is(button, summary) { cursor: pointer; }
.strata-table-utilities :is(button, summary):hover, .strata-table-secondary-collapsed :is(button, summary):hover { border-color: var(--controls-primary); color: var(--text); }
.strata-table-utilities button:disabled { opacity: .42; cursor: default; }
.strata-table-utilities button[aria-pressed="true"], .strata-table-secondary-collapsed button[aria-pressed="true"] { border-color: var(--controls-selected); background: color-mix(in srgb, var(--controls-selected) 20%, var(--surfaces-field)); color: var(--controls-selected-tint); }
.strata-table-utilities input[type="search"] { min-width: 150px; }
.strata-table-discussion { margin-left: auto; }
.strata-table-head .strata-table-discussion-narrow { display: none; flex-basis: 100%; margin-left: 0; }
.strata-table-discussion button { border-color: color-mix(in srgb, var(--controls-primary) 40%, transparent); color: var(--document-headings); }
.strata-table-columns { position: relative; }

.strata-table-columns[open] > summary { color: var(--surfaces-overlay-text); }
.strata-table-columns[open] > label { display: flex; align-items: center; gap: 6px; padding: 2px 5px; color: var(--surfaces-overlay-text); font-size: calc(11px * var(--zoom, 1)); font-weight: 700; }
.strata-table-options { display: none; position: relative; }
.strata-table-options > summary { list-style: none; min-height: 28px; border: 1px solid var(--visuals-table-border); border-radius: 9px; padding: 4px 9px; color: var(--dim); font: 800 calc(10px * var(--zoom, 1)) var(--font-text), sans-serif; cursor: pointer; }
.strata-table-options[open] > .strata-table-secondary-collapsed { position: absolute; z-index: 16; top: calc(100% + 5px); right: 0; display: grid; width: min(310px, calc(100vw - 48px)); gap: 7px; border: 1px solid var(--visuals-table-border); border-radius: 12px; padding: 9px; background: var(--surfaces-overlay); box-shadow: 0 15px 38px -12px color-mix(in srgb, var(--surfaces-window) 85%, transparent); }

.strata-table-scroll { width: 100%; max-height: 560px; overflow: auto; }
.strata-table-block table { background: transparent; width: 100%; margin: 0; border: 0; border-radius: 0; border-collapse: separate; border-spacing: 0; table-layout: auto; white-space: normal; }
.strata-table-block th { position: sticky; top: 0; z-index: 3; border: 0; padding: 11px 12px; background: var(--visuals-table-header); color: var(--document-table-heading); font-size: calc(13px * var(--zoom, 1)); font-weight: 800; text-align: left; }
.strata-table-block td { position: relative; border: 0; border-top: 1px solid var(--visuals-table-border); padding: 12px; color: var(--document-body); font-size: calc(16px * var(--zoom, 1)); line-height: 1.48; vertical-align: top; transition: background .12s ease; }
.strata-table-block td:first-child { color: var(--document-headings); font-weight: 800; }
.strata-table-block :is(td, th) > p { margin: 0; }
.conversation-prose tbody tr:hover td, .strata-prosemirror tbody tr:hover td, .strata-table-block tbody tr:hover td { background: var(--visuals-table-hover); }
.strata-table-block[data-density="compact"] th, .strata-table-block[data-density="compact"] td { padding: 5px 9px; font-size: calc(13px * var(--zoom, 1)); line-height: 1.4; }
.strata-table-derived { min-height: 74px; padding: 10px; color: var(--document-body); }
.strata-table-derived[hidden] { display: none; }
.strata-table-derived:not(:has(table, dl)) { display: grid; place-items: center; padding: 28px; color: var(--interface-muted); font-size: calc(14px * var(--zoom, 1)); font-weight: 700; }
.strata-table-derived table[aria-label="Table view"] { border: 1px solid var(--visuals-table-border); border-radius: 13px; overflow: hidden; }
.strata-table-focus-row { display: grid; grid-template-columns: minmax(150px, .32fr) minmax(0, 1fr); margin: 0; overflow: hidden; border: 1px solid var(--visuals-table-border); border-radius: 13px; background: var(--visuals-table-fill); }
.strata-table-focus-row dt, .strata-table-focus-row dd { margin: 0; border-top: 1px solid var(--visuals-table-border); padding: 12px 15px; }
.strata-table-focus-row dt:first-of-type, .strata-table-focus-row dd:first-of-type { border-top: 0; }
.strata-table-focus-row dt { background: var(--visuals-table-header); color: var(--muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.strata-table-focus-row dd { color: var(--document-body); font-size: calc(16px * var(--zoom, 1)); line-height: 1.48; }
.strata-table-derived table[aria-label="Compared table rows"] { display: block; }
.strata-table-derived table[aria-label="Compared table rows"] thead { display: none; }
.strata-table-derived table[aria-label="Compared table rows"] tbody { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px; }
.strata-table-derived table[aria-label="Compared table rows"] tr { display: block; border: 1px solid var(--visuals-table-border); border-radius: 13px; padding: 5px; background: var(--visuals-table-fill); }
.strata-table-derived table[aria-label="Compared table rows"] td { display: block; border: 0; border-top: 1px solid var(--visuals-table-border); border-radius: 8px; cursor: pointer; }
.strata-table-derived table[aria-label="Compared table rows"] td:first-child { border-top: 0; background: var(--visuals-table-header); }
.strata-table-derived table[aria-label="Compared table rows"] td::before { display: block; margin-bottom: 3px; color: var(--muted); font-family: var(--mono); font-size: calc(8px * var(--zoom, 1)); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; content: attr(data-label); }
.strata-table-derived table[aria-label="Compared table rows"] tr:hover td { background: var(--visuals-table-hover); }
.strata-table-block.is-temporarily-revealed { outline: 2px solid var(--controls-warning); outline-offset: 2px; }
.strata-prosemirror[data-table-focus] > :not(.strata-table-block[data-center-focus="true"]) { display: none; }
.strata-table-block[data-center-focus="true"] { min-height: calc(100vh - 190px); margin-top: 0; }
.strata-table-block[data-center-focus="true"] .strata-table-scroll { max-height: none; }
.strata-table-block[data-center-focus="true"] .strata-table-title { max-width: none; font-size: calc(20px * var(--zoom, 1)); }
@container (max-width: 619px) {
  .strata-table-utilities { display: none; }
  .strata-table-head .strata-table-discussion-narrow { display: flex; }
  .strata-table-options { display: block; }
  .strata-table-options[open] { flex: 1 0 100%; }
  .strata-table-options[open] > .strata-table-secondary-collapsed { position: static; width: 100%; margin-top: 5px; box-shadow: none; }
  .strata-table-title { max-width: 100%; }
}

/* Right column: populated Changes, Items, pinned changes, and Attached as cards. */
.change-row, .annotation-row { display: flex; width: 100%; flex-direction: column; align-items: stretch; gap: 7px; margin: 0 0 8px; border: 1px solid var(--border-soft); border-left: 4px solid var(--controls-primary); border-radius: 15px; padding: 10px 11px; background: color-mix(in srgb, var(--surfaces-inset) 56%, transparent); color: var(--body); text-align: left; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
.change-row:hover, .annotation-row:hover { border-color: color-mix(in srgb, var(--controls-primary) 45%, var(--border-soft)); background: color-mix(in srgb, var(--surfaces-inset) 82%, transparent); }
.change-row:active, .annotation-row:active { transform: scale(.985); }
.change-meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
.change-avatar { display: grid; width: 27px; height: 27px; flex: none; place-items: center; border-radius: 9px; font-size: calc(10px * var(--zoom, 1)); font-weight: 800; }
.change-meta strong { overflow: hidden; font-size: calc(11px * var(--zoom, 1)); font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
.change-meta small { color: var(--muted); font-size: calc(10px * var(--zoom, 1)); font-weight: 600; }
.change-time { margin-left: auto; flex: none; }
.change-snippet { display: flex; flex-direction: column; overflow: hidden; border-radius: 9px; background: color-mix(in srgb, var(--surfaces-window) 70%, transparent); font-family: var(--mono); font-size: calc(10px * var(--zoom, 1)); font-weight: 500; line-height: 1.6; }
.change-snippet > span { overflow: hidden; padding: 3px 8px; text-overflow: ellipsis; white-space: nowrap; }
.change-snippet code { border-radius: 5px; padding: 0 4px; background: var(--surfaces-code); font-family: var(--mono); font-size: .95em; }
.snippet-removed { background: var(--changes-removed-background); color: var(--changes-removed-tint); text-decoration: line-through; }
.snippet-added { background: var(--changes-added-background); color: var(--changes-added-tint); }
.snippet-context { color: var(--dim); }
.change-group-heading, .save-history-heading { margin: 8px 2px 6px; color: var(--muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.change-row-actions { display: flex; flex-direction: column; gap: 7px; margin: 0 0 8px; border: 1px solid var(--border-soft); border-left: 4px solid var(--controls-primary); border-radius: 15px; padding: 10px 11px; background: color-mix(in srgb, var(--surfaces-inset) 56%, transparent); }
.change-row-actions .change-row-jump { display: flex; flex-direction: column; gap: 7px; border: 0; padding: 0; background: transparent; color: var(--body); text-align: left; cursor: pointer; }
.change-row-buttons { display: flex; gap: 6px; }
.suggestion-bulk-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; border: 1px solid var(--border-soft); border-radius: 12px; padding: 7px 9px; background: color-mix(in srgb, var(--surfaces-window) 40%, transparent); font-size: calc(11px * var(--zoom, 1)); font-weight: 800; }
.annotation-row.kind-decision, .annotation-row.kind-question { border-left-color: var(--controls-warning); }
.annotation-row.kind-comment { border-left-color: var(--people-you); }
.annotation-row.kind-suggestion { border-left-color: var(--controls-primary); }
.annotation-row.status-resolved { border-color: color-mix(in srgb, var(--controls-positive) 38%, transparent); border-left-color: var(--controls-positive); background: color-mix(in srgb, var(--controls-positive) 5%, transparent); }
.annotation-row.status-orphaned { border-left-color: var(--people-external); }
.annotation-meta { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--muted); font-family: var(--mono); font-size: calc(8px * var(--zoom, 1)); font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
.annotation-chip { flex: none; border-radius: 999px; padding: 2px 7px; font-family: var(--mono); font-size: calc(8px * var(--zoom, 1)); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
.annotation-place { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reply-count { margin-left: auto; flex: none; color: var(--document-headings); }
.annotation-text { display: -webkit-box; overflow: hidden; color: var(--text); font-size: calc(12px * var(--zoom, 1)); font-weight: 600; line-height: 1.42; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.annotation-text code, .quote-mini code { border-radius: 4px; padding: 0 3px; background: var(--surfaces-code); font-family: var(--mono); font-size: .9em; }
.quote-mini { display: block; overflow: hidden; border-left: 2px solid var(--document-quote); padding: 3px 0 3px 8px; color: var(--dim); font-size: calc(10px * var(--zoom, 1)); font-style: italic; font-weight: 600; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
.decision-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.decision-chips > span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; background: color-mix(in srgb, var(--surfaces-window) 60%, transparent); color: var(--muted); font-size: calc(8px * var(--zoom, 1)); font-weight: 800; }
.decision-chips > span.selected { border-color: var(--controls-positive); background: color-mix(in srgb, var(--controls-positive) 12%, transparent); color: var(--controls-positive); }
.pinned-changes { max-height: 155px; flex: none; overflow: auto; border-bottom: 1px solid var(--line); padding: 0 0 6px; background: color-mix(in srgb, var(--surfaces-window) 28%, transparent); }
.pinned-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surfaces-panel); color: var(--document-headings); font-size: calc(11px * var(--zoom, 1)); font-weight: 800; }
.pinned-head span { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: calc(8px * var(--zoom, 1)); font-weight: 500; }
.pinned-changes > button { display: grid; width: calc(100% - 20px); grid-template-columns: minmax(0, 1fr); gap: 2px; margin: 6px 10px 0; border: 0; border-left: 3px solid var(--controls-primary); border-radius: 0 8px 8px 0; padding: 4px 8px; background: transparent; color: var(--dim); font-size: calc(9px * var(--zoom, 1)); line-height: 1.35; text-align: left; cursor: pointer; }
.pinned-changes > button:hover { background: var(--surfaces-field); }
.pinned-changes strong { color: var(--interface-muted); font-size: calc(9px * var(--zoom, 1)); }
.pinned-changes span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pinned-changes > span { display: block; padding: 6px 12px; color: var(--muted); font-size: calc(10px * var(--zoom, 1)); font-weight: 700; }
.agents-panel { height: auto; min-height: 142px; flex: 1; border-radius: 22px; overflow: auto; }
.agent-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; border: 1px solid var(--border-soft); border-radius: 15px; padding: 9px 10px; background: linear-gradient(145deg, color-mix(in srgb, var(--controls-primary) 12%, transparent), color-mix(in srgb, var(--surfaces-panel) 76%, transparent)); transition: all .15s; }
.agent-row:hover { border-color: color-mix(in srgb, var(--controls-primary) 45%, var(--border-soft)); }
.agent-detail > span { color: var(--dim); }
.agent-detail > span .state-dot { box-shadow: 0 0 10px currentColor; }
.agents-panel .empty-subtle { padding: 10px 6px 4px; }

/* Registered components: one shared shell, one visual grammar per component. */
.strata-component .strata-fold-toggle, .strata-component .strata-fold-hidden-status { display: none; }
.strata-component .strata-fold-heading { display: block; margin: 0; border: 0; padding: 0; }
.strata-component .strata-fold-heading::before { display: none; }
.strata-component { position: relative; margin: 24px 0; overflow: clip; border: 1px solid color-mix(in srgb, var(--surfaces-border) 96%, transparent); border-radius: 22px; background: linear-gradient(145deg, color-mix(in srgb, var(--surfaces-inset) 62%, transparent), color-mix(in srgb, var(--surfaces-panel) 96%, transparent)); box-shadow: 0 18px 40px -28px color-mix(in srgb, var(--surfaces-window) 90%, transparent); }
.strata-component::after { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(130deg, color-mix(in srgb, var(--interface-primary) 3.5%, transparent), transparent 36%); content: ""; }
.strata-component__eyebrow { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 18px 6px; user-select: none; }
.strata-component__icon { display: grid; width: 34px; height: 34px; flex: none; place-items: center; border-radius: 11px; background: linear-gradient(145deg, var(--controls-primary-highlight), var(--controls-primary)); color: var(--controls-primary-text); box-shadow: 0 9px 22px color-mix(in srgb, var(--controls-primary) 30%, transparent); font-size: 16px; font-weight: 500; }
.strata-component__label { color: var(--document-headings); font-size: calc(15px * var(--zoom, 1)); font-weight: 800; letter-spacing: -.01em; }
.strata-component__qualifier { border-radius: 999px; padding: 4px 9px; background: color-mix(in srgb, var(--component-accent, var(--controls-primary)) 17%, transparent); color: var(--component-accent, var(--controls-primary-tint)); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.strata-component__qualifier[hidden] { display: none; }
.strata-component-tooling { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.strata-component-action { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: transparent; color: var(--dim); font-size: calc(10px * var(--zoom, 1)); font-weight: 800; letter-spacing: 0; text-transform: none; cursor: pointer; }
.strata-component-action:hover { border-color: var(--controls-primary); color: var(--text); }
.strata-component-action[aria-pressed="true"] { border-color: var(--controls-primary-highlight); background: color-mix(in srgb, var(--controls-primary-highlight) 10%, transparent); color: var(--document-headings); }
.strata-component-action:disabled { opacity: .42; cursor: default; }
.strata-component__body { position: relative; z-index: 1; padding: 4px 20px 18px; }
.strata-component__body > :last-child { margin-bottom: 0; }
.strata-component__body > p { font-size: calc(17px * var(--zoom, 1)); line-height: 1.55; }
.strata-component__body > :is(h3, .strata-fold-heading) > h3, .strata-component__body > h3 { margin: 6px 0 8px; color: var(--document-headings); font-size: calc(20px * var(--zoom, 1)); }

/* Callout: a compact message with an icon, a semantic accent, a strong title, and a soft inset body. */
.strata-component--callout { --component-accent: var(--document-small-headings); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; border-color: color-mix(in srgb, var(--component-accent) 44%, var(--surfaces-border)); background: radial-gradient(450px 180px at 5% 50%, color-mix(in srgb, var(--component-accent) 14%, transparent), transparent 75%), linear-gradient(100deg, color-mix(in srgb, var(--surfaces-inset) 90%, transparent), color-mix(in srgb, var(--surfaces-panel) 96%, transparent)); }
.strata-component--callout[data-strata-component-state="warning"] { --component-accent: var(--controls-warning); }
.strata-component--callout[data-strata-component-state="implication"] { --component-accent: var(--controls-primary-tint); }
.strata-component--callout[data-strata-component-state="support"] { --component-accent: var(--controls-positive); }
.strata-component--callout .strata-component__eyebrow { flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 18px 18px; }
.strata-component--callout .strata-component__icon { width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(145deg, color-mix(in srgb, var(--component-accent) 70%, var(--interface-primary)), var(--component-accent)); color: var(--surfaces-window); box-shadow: 0 14px 36px color-mix(in srgb, var(--component-accent) 22%, transparent); font-size: 24px; }
.strata-component--callout .strata-component__label { color: var(--component-accent); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.strata-component--callout .strata-component__body { padding: 18px 22px 18px 18px; }
.strata-component--callout .strata-component__body h3 { margin: 0 0 4px; color: var(--component-accent); font-size: calc(21px * var(--zoom, 1)); }
.strata-component--callout .strata-component__body > p { margin: 0 0 8px; font-size: calc(17px * var(--zoom, 1)); }
.strata-component--callout .strata-component__body > :is(ul, ol) { margin: 6px 0 0; border-radius: 14px; padding: 10px 14px 10px 32px; background: color-mix(in srgb, var(--surfaces-window) 52%, transparent); color: var(--dim); font-size: calc(15px * var(--zoom, 1)); }

/* Verdict: the controlling judgment, with the strongest section-level emphasis. */
.strata-component--verdict { --component-accent: var(--controls-primary); border-color: color-mix(in srgb, var(--document-headings) 28%, transparent); background: radial-gradient(380px 170px at 0 50%, color-mix(in srgb, var(--controls-primary) 20%, transparent), transparent 74%), linear-gradient(110deg, color-mix(in srgb, var(--surfaces-inset) 76%, transparent), color-mix(in srgb, var(--surfaces-panel) 92%, transparent)); }
.strata-component--verdict[data-strata-component-state="recommended"] { --component-accent: var(--controls-positive); }
.strata-component--verdict[data-strata-component-state="caution"] { --component-accent: var(--controls-warning); }
.strata-component--verdict[data-strata-component-state="blocked"] { --component-accent: var(--controls-danger); }
.strata-component--verdict .strata-component__eyebrow { padding: 20px 22px 0 22px; }
.strata-component--verdict .strata-component__label { color: var(--document-headings); font-size: calc(12px * var(--zoom, 1)); letter-spacing: .1em; text-transform: uppercase; }
.strata-component--verdict .strata-component__body { padding: 6px 22px 22px 68px; }
.strata-component--verdict .strata-component__body h3 { margin: 0 0 6px; color: var(--text); font-size: calc(24px * var(--zoom, 1)); line-height: 1.2; }
.strata-component--verdict .strata-component__body > p { margin: 0 0 8px; color: var(--text); font-size: calc(22px * var(--zoom, 1)); font-weight: 500; line-height: 1.48; }
.strata-component--verdict .strata-component__body > :is(ul, ol) { color: var(--dim); font-size: calc(17px * var(--zoom, 1)); }

/* MetricStrip: distinct metric cells with large values and quiet labels. */
.strata-component--metricstrip { --component-accent: var(--controls-primary); }
.strata-component--metricstrip .strata-component__body > ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 4px 0 0; padding: 0; list-style: none; }
.strata-component--metricstrip .strata-component__body > ul > li { min-width: 0; border: 1px solid var(--border-soft); border-radius: 13px; padding: 12px 14px; background: color-mix(in srgb, var(--surfaces-window) 42%, transparent); }
.strata-component--metricstrip .strata-component__body > ul > li::marker { content: ""; }
.strata-component--metricstrip .strata-component__body > ul > li { margin: 0; }
.strata-component--metricstrip .strata-component__body > ul > li > p { margin: 0; color: var(--text); font-size: calc(24px * var(--zoom, 1)); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.strata-component--metricstrip .strata-component__body > ul > li strong { display: block; margin-bottom: 5px; color: var(--muted); font-family: var(--mono); font-size: calc(9px * var(--zoom, 1)); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }

/* PhaseBoard: phases as coordinated columns with clear task grouping. */
.strata-component--phaseboard { --component-accent: var(--controls-focus); container-type: inline-size; }
.strata-component--phaseboard .strata-component__body { column-count: min(var(--phase-count, 1), 3); column-gap: 14px; column-rule: 1px solid var(--border-soft); column-fill: balance; padding-top: 8px; }
.strata-component--phaseboard .strata-component__body > * { break-inside: avoid; }
.strata-component--phaseboard .strata-component__body > .strata-fold-heading:has(> h3), .strata-component--phaseboard .strata-component__body > h3 { break-before: column; }
.strata-component--phaseboard .strata-component__body > :first-child { break-before: auto; }
.strata-component--phaseboard .strata-component__body h3 { margin: 0 0 10px; color: var(--document-headings); font-size: calc(16px * var(--zoom, 1)); }
.strata-component--phaseboard .strata-component__body > p { margin: 0 0 8px; color: var(--dim); font-size: calc(13px * var(--zoom, 1)); line-height: 1.4; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) { margin: 0 0 10px; padding: 0; list-style: none; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) > li { position: relative; margin: 7px 0; border: 1px solid var(--border-soft); border-radius: 11px; padding: 9px 9px 9px 31px; background: color-mix(in srgb, var(--surfaces-window) 42%, transparent); color: var(--dim); font-size: calc(13px * var(--zoom, 1)); line-height: 1.4; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) > li::before { position: absolute; top: 11px; left: 9px; width: 15px; height: 15px; border: 1px solid var(--line); border-radius: 5px; content: ""; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) > li[data-task-item="true"] { padding-left: 9px; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) > li[data-task-item="true"]::before { display: none; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) > li > p { margin: 0; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) > li em { display: block; margin-top: 3px; color: var(--document-bold); font-size: calc(10px * var(--zoom, 1)); font-style: normal; }
.strata-component--phaseboard .strata-component__body > :is(ul, ol) > li strong { color: var(--text); }
.strata-component--phaseboard .strata-component__body > .strata-table-block { margin: 6px 0 12px; border-radius: 13px; }
.strata-component--phaseboard .strata-component__body > .strata-table-block .strata-table-toolbar { display: none; }
.strata-component--phaseboard .strata-component__body > .strata-table-block td { padding: 8px 10px; font-size: calc(13px * var(--zoom, 1)); }
.strata-component--phaseboard .strata-component__body > .strata-table-block th { padding: 7px 10px; font-size: calc(11px * var(--zoom, 1)); }
@container (max-width: 700px) {
  .strata-component--phaseboard .strata-component__body { column-count: 1; }
  .strata-component--phaseboard .strata-component__body > .strata-fold-heading:has(> h3), .strata-component--phaseboard .strata-component__body > h3 { break-before: auto; margin-top: 16px; }
}

/* DecisionMatrix: alternatives lead, the deciding criterion reads first, one alternative can be focused. */
.strata-component--decisionmatrix { --component-accent: var(--visuals-category-1); }
.strata-component--decisionmatrix [data-component-body="decisionmatrix"] .strata-table-block { margin: 4px 0 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.strata-component--decisionmatrix [data-component-body="decisionmatrix"] .strata-table-toolbar { display: none; }
.strata-component--decisionmatrix [data-component-body="decisionmatrix"] table { border-collapse: separate; border-spacing: 0 7px; }

.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:first-child { margin-top: 6px; }
.strata-component--evidencechain [data-component-body="evidencechain"] h3 { margin: 0; border: 0; padding: 0; color: var(--document-headings); font-family: var(--mono); font-size: calc(11px * var(--zoom, 1)); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:first-child + p { margin: 0 0 8px; border: 1px solid color-mix(in srgb, var(--document-headings) 28%, transparent); border-radius: 18px; padding: 16px 18px; background: radial-gradient(360px 140px at 0 50%, color-mix(in srgb, var(--controls-primary) 18%, transparent), transparent 78%), color-mix(in srgb, var(--surfaces-window) 36%, transparent); color: var(--text); font-size: calc(20px * var(--zoom, 1)); font-weight: 600; line-height: 1.35; }

.strata-component--evidencechain [data-component-body="evidencechain"] > :is(ul, ol) > li > p { margin: 0; }

.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:nth-of-type(3)::before { border-color: var(--controls-positive); box-shadow: 0 0 14px color-mix(in srgb, var(--controls-positive) 45%, transparent); }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:nth-of-type(3) ~ p { margin: 0; border: 1px solid color-mix(in srgb, var(--controls-positive) 36%, transparent); border-radius: 18px; padding: 14px 17px; background: color-mix(in srgb, var(--controls-positive) 6%, transparent); color: var(--dim); font-size: calc(16px * var(--zoom, 1)); }
.strata-component--evidencechain[data-evidence-active] [data-component-body="evidencechain"] :is(.strata-fold-heading, li):focus-within { outline: 2px solid var(--controls-focus); outline-offset: 3px; border-radius: 12px; background: color-mix(in srgb, var(--controls-selected) 13%, transparent); }
.strata-component--evidencechain[data-evidence-active] [data-component-body="evidencechain"] > .strata-fold-heading:first-child h3 { background: color-mix(in srgb, var(--controls-selected) 7%, transparent); }

/* AnnotatedScreenshot: the image leads; pins and their notes are easy to find. */
.strata-component--annotatedscreenshot { --component-accent: var(--visuals-category-4); }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] { display: grid; gap: 14px; padding-top: 8px; }
.strata-screenshot-image { position: relative; display: block; width: 100%; max-width: 100%; overflow: hidden; border: 1px solid color-mix(in srgb, var(--controls-primary) 45%, var(--line)); border-radius: 18px; background: var(--surfaces-window); box-shadow: inset 0 0 60px color-mix(in srgb, var(--controls-primary) 8%, transparent); }
.strata-screenshot-image img { display: block; width: 100%; height: auto; }

.strata-screenshot-pin-layer { position: absolute; inset: 0; pointer-events: none; }
