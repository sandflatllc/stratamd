.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading { position: relative; margin: 16px 0 8px; }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading::before { position: absolute; top: 0; left: -41px; display: block; width: 16px; height: 16px; border: 3px solid var(--controls-primary); border-radius: 50%; background: var(--surfaces-panel); box-shadow: 0 0 14px color-mix(in srgb, var(--controls-primary) 50%, transparent); content: ""; }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:first-child { margin-top: 6px; }
.strata-component--evidencechain [data-component-body="evidencechain"] h3 { margin: 0; border: 0; padding: 0; color: var(--document-headings); font-family: var(--mono); font-size: calc(11px * var(--zoom, 1)); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:first-child + p { margin: 0 0 8px; border: 1px solid color-mix(in srgb, var(--document-headings) 28%, transparent); border-radius: 18px; padding: 16px 18px; background: radial-gradient(360px 140px at 0 50%, color-mix(in srgb, var(--controls-primary) 18%, transparent), transparent 78%), color-mix(in srgb, var(--surfaces-window) 36%, transparent); color: var(--text); font-size: calc(20px * var(--zoom, 1)); font-weight: 600; line-height: 1.35; }
.strata-component--evidencechain [data-component-body="evidencechain"] > :is(ul, ol) { display: grid; gap: 10px; margin: 0 0 8px; padding: 0; list-style: none; }
.strata-component--evidencechain [data-component-body="evidencechain"] > :is(ul, ol) > li { position: relative; margin: 0; border: 1px solid var(--line); border-radius: 15px; padding: 12px 13px; background: color-mix(in srgb, var(--surfaces-window) 46%, var(--surfaces-panel)); color: var(--text); font-size: calc(15px * var(--zoom, 1)); line-height: 1.4; transition: border-color .15s, transform .15s; }
.strata-component--evidencechain [data-component-body="evidencechain"] > :is(ul, ol) > li > p { margin: 0; }
.strata-component--evidencechain [data-component-body="evidencechain"] > :is(ul, ol) > li a { color: var(--interface-muted); font-family: var(--mono); font-size: calc(12px * var(--zoom, 1)); text-decoration: none; }
.strata-component--evidencechain [data-component-body="evidencechain"] > :is(ul, ol) > li:hover { border-color: var(--controls-focus); transform: translateX(3px); }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:nth-of-type(3) h3 { color: var(--controls-positive); }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:nth-of-type(3)::before { border-color: var(--controls-positive); box-shadow: 0 0 14px color-mix(in srgb, var(--controls-positive) 45%, transparent); }
.strata-component--evidencechain [data-component-body="evidencechain"] > .strata-fold-heading:nth-of-type(3) ~ p { margin: 0; border: 1px solid color-mix(in srgb, var(--controls-positive) 36%, transparent); border-radius: 18px; padding: 14px 17px; background: color-mix(in srgb, var(--controls-positive) 6%, transparent); color: var(--dim); font-size: calc(16px * var(--zoom, 1)); }
.strata-component--evidencechain[data-evidence-active] [data-component-body="evidencechain"] :is(.strata-fold-heading, li):focus-within { outline: 2px solid var(--controls-focus); outline-offset: 3px; border-radius: 12px; background: color-mix(in srgb, var(--controls-selected) 13%, transparent); }
.strata-component--evidencechain[data-evidence-active] [data-component-body="evidencechain"] > .strata-fold-heading:first-child h3 { background: color-mix(in srgb, var(--controls-selected) 7%, transparent); }

/* AnnotatedScreenshot: the image leads; pins and their notes are easy to find. */
.strata-component--annotatedscreenshot { --component-accent: var(--visuals-category-4); }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] { display: grid; gap: 14px; padding-top: 8px; }
.strata-screenshot-image { position: relative; display: block; width: 100%; max-width: 100%; overflow: hidden; border: 1px solid color-mix(in srgb, var(--controls-primary) 45%, var(--line)); border-radius: 18px; background: var(--surfaces-window); box-shadow: inset 0 0 60px color-mix(in srgb, var(--controls-primary) 8%, transparent); }
.strata-screenshot-image img { display: block; width: 100%; height: auto; }
.strata-component--annotatedscreenshot[data-screenshot-focused] .strata-screenshot-image { display: grid; max-height: min(72vh, 900px); padding: 12px; }
.strata-component--annotatedscreenshot[data-screenshot-focused] .strata-screenshot-image img { width: 100%; max-height: min(72vh, 900px); object-fit: contain; }
.strata-screenshot-pin-layer { position: absolute; inset: 0; pointer-events: none; }
.strata-screenshot-pin { position: absolute; display: grid; width: 30px; height: 30px; place-items: center; border: 2px solid var(--interface-primary); border-radius: 50%; background: linear-gradient(145deg, var(--visuals-category-3), var(--visuals-category-1)); box-shadow: 0 5px 20px color-mix(in srgb, var(--visuals-category-3) 55%, transparent); color: var(--interface-primary); font: 500 11px var(--mono); transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; }
.strata-screenshot-pin:hover, .strata-screenshot-pin.is-active { box-shadow: 0 0 0 6px color-mix(in srgb, var(--controls-primary) 18%, transparent), 0 8px 26px color-mix(in srgb, var(--visuals-category-3) 65%, transparent); transform: translate(-50%, -50%) scale(1.16); }
.strata-screenshot-status { display: flex; align-items: center; gap: 10px; margin: 6px 20px 0; border: 1px solid var(--controls-warning); border-radius: 12px; padding: 8px 12px; color: var(--controls-warning); font-size: calc(13px * var(--zoom, 1)); font-weight: 700; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] .strata-table-block { margin: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] .strata-table-toolbar { display: none; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] .strata-table-scroll { max-height: none; overflow: visible; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] table { display: block; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] tbody { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 9px; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] tr { display: block; border: 1px solid var(--line); border-radius: 14px; padding: 11px; background: color-mix(in srgb, var(--surfaces-window) 43%, transparent); }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] tr:first-child { display: none; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] tr.is-active { border-color: var(--controls-primary-highlight); background: color-mix(in srgb, var(--controls-primary-highlight) 8%, transparent); }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] tr:hover td { background: transparent; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] td { border: 0; padding: 0; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] td:first-child { display: inline-grid; min-width: 18px; height: 18px; place-items: center; border-radius: 50%; padding: 0 5px; background: var(--controls-primary); color: var(--controls-primary-text); font: 500 calc(9px * var(--zoom, 1)) var(--mono); }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] td:nth-child(2), .strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] td:nth-child(3), .strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] td:nth-child(4) { display: none; }
.strata-component--annotatedscreenshot [data-component-body="annotatedscreenshot"] td:last-child { display: block; margin-top: 6px; color: var(--dim); font-size: calc(13px * var(--zoom, 1)); line-height: 1.4; }

/* Table cells hold ProseMirror paragraphs; the paragraph spacing belongs to prose, not cells. */
.prosemirror-host .ProseMirror .strata-table-block :is(td, th) > p { margin: 0; }
/* Cockpit engine surfaces. */
.engine-empty { display: grid; gap: 10px; padding: 22px 14px; color: var(--body); }
.engine-empty small { display: block; color: var(--muted); }
.engine-empty button { justify-self: start; border: 0; border-radius: 999px; padding: 3px 10px; background: transparent; color: var(--controls-primary); font: inherit; font-weight: 800; cursor: pointer; }
.engine-empty button:hover { background: color-mix(in srgb, var(--controls-primary) 15%, transparent); }
.projects-panel { --project-thread-quiet: color-mix(in srgb, var(--dim) 62%, transparent); container: projects / inline-size; height: 100%; overflow: auto; padding: 10px 8px 16px; }
.projects-header { display: flex; align-items: center; gap: 6px; padding: 12px 4px 5px; }
.projects-header h2 { min-width: 0; flex: 1; margin: 0; font-size: calc(13px * var(--zoom, 1)); letter-spacing: .02em; }
.projects-header :is(select, button) { border: 0; border-radius: 6px; padding: 4px 6px; background: transparent; color: var(--muted); font: inherit; font-size: calc(11px * var(--zoom, 1)); }
.projects-header button { font-size: calc(16px * var(--zoom, 1)); cursor: pointer; }
.projects-add-form { display: grid; gap: 5px; margin: 2px 0 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surfaces-inset); }
.projects-add-form input { min-width: 0; border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px; background: var(--surfaces-field); color: inherit; }
.projects-add-form > div { display: flex; justify-content: flex-end; gap: 5px; }
.project-group { padding: 1px 0 8px; }
.project-folder-header, .project-shelf-header { display: flex; width: 100%; min-width: 0; align-items: center; gap: 6px; border: 0; padding: 6px 5px; background: none; color: var(--text); cursor: pointer; text-align: left; }
.project-folder-header strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-folder-chevron, .project-shelf-header > i { color: var(--muted); font-style: normal; transition: transform 120ms ease; }
.project-group[data-open="true"] .project-folder-chevron, .project-shelf[data-expanded="true"] .project-shelf-header > i { transform: rotate(90deg); }
.project-folder-icon { color: var(--muted); font-size: calc(16px * var(--zoom, 1)); }
.project-folder-state { flex: none; width: 6px; height: 6px; margin-left: auto; border-radius: 50%; }
.project-folder-state[data-state="input"] { background: var(--controls-warning); }
.project-folder-state[data-state="working"] { background: var(--controls-positive); }
.project-folder-state[data-state="completed"] { background: var(--controls-primary-highlight); }
.project-thread { position: relative; display: grid; grid-template-columns: 23px auto minmax(0, 1fr) auto auto 20px; align-items: center; gap: 4px; min-height: 30px; border-radius: 8px; padding: 2px 3px; color: var(--project-thread-quiet); }
/* Rows under a folder indent so the star sits under the folder icon and the two columns read apart. */
.project-group .project-thread { margin-left: 16px; padding-right: 9px; grid-template-columns: 23px auto minmax(0, 1fr) auto 12px calc(44px * var(--zoom, 1)); }
/* Keep the time aligned with the folder's +, with 24px between title and time
   when there are no marks. The settle action fits in that reserved gap. */
.project-group .project-thread time { grid-column: 6; text-align: right; font-variant-numeric: tabular-nums; }
.project-group .project-thread-settle { grid-column: 5; grid-row: 1; width: 20px; margin-left: -4px; padding: 0; }
.project-group .project-show-more { padding-left: 50px; }
/* Color axis: quiet by default; favorites and rows that need the owner step up; the selected row is full strength inside its pill. */
.project-thread[data-pinned="true"], .project-thread[data-state="completed"], .project-thread[data-state="input"], .project-thread[data-state="failed"] { color: var(--dim); }
.project-thread:hover { background: color-mix(in srgb, var(--card-2) 55%, transparent); color: var(--dim); }
.project-thread.active, .project-thread.active:hover { background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--text); }
.project-thread-star, .project-thread-open, .project-thread-settle, .project-thread-restore { min-width: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; }
.project-thread-star { grid-column: 1; }
.project-thread-star[aria-pressed="true"] { color: var(--controls-warning); }
.project-thread-open { overflow: hidden; padding: 4px 0; color: inherit; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
.project-thread-open span { overflow: hidden; text-overflow: ellipsis; }
.project-thread-open span.unread { font-weight: 750; }
.project-thread-status { display: inline-flex; grid-column: 2; align-items: center; gap: 5px; font-size: calc(10px * var(--zoom, 1)); font-weight: 700; white-space: nowrap; }
.project-thread-status i { flex: none; width: 7px; height: 7px; border-radius: 50%; font-style: normal; }
.project-thread-status.working i { background: var(--controls-positive); animation: project-thread-pulse 1.4s ease-out infinite; }
.project-thread-status.completed i { background: var(--controls-primary-highlight); }
.project-thread-status.pill { border-radius: 999px; padding: 1px 7px 1px 5px; }
.project-thread-status.input { color: var(--controls-warning); background: color-mix(in srgb, var(--controls-warning) 18%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--controls-warning) 38%, transparent); }
.project-thread-status.input i { background: var(--controls-warning); }
.project-thread-status.failed { color: var(--controls-danger); background: color-mix(in srgb, var(--controls-danger) 18%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--controls-danger) 38%, transparent); }
.project-thread-status.failed i { background: var(--controls-danger); }
/* Preserve clickable titles when status labels compete with the time column. */
@container projects (max-width: 260px) {
  .project-group .project-thread-status.pill { padding: 0; gap: 0; font-size: 0; background: none; box-shadow: none; }
}
@container projects (max-width: 200px) {
  .project-group .project-thread { margin-left: 0; column-gap: 2px; grid-template-columns: 18px auto minmax(0, 1fr) auto 12px calc(44px * var(--zoom, 1)); }
}
.project-thread-status.monitoring { font-size: calc(12px * var(--zoom, 1)); line-height: 1; }
@keyframes project-thread-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--controls-positive) 55%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; opacity: .7; } 100% { box-shadow: 0 0 0 0 transparent; opacity: 1; } }
.project-thread-project { grid-column: 2; overflow: hidden; color: var(--muted); font-size: calc(10px * var(--zoom, 1)); text-overflow: ellipsis; white-space: nowrap; }
.project-thread-open { grid-column: 3; }
.project-thread-marks { display: inline-flex; grid-column: 4; align-items: center; gap: 3px; color: var(--controls-primary-highlight); }
.project-thread-marks i { font-style: normal; }
.project-thread-marks b { min-width: 16px; border-radius: 999px; padding: 1px 4px; background: var(--controls-primary); color: var(--controls-primary-text); font-size: calc(9px * var(--zoom, 1)); text-align: center; }
.project-thread time { grid-column: 5; color: var(--muted); font-size: calc(10px * var(--zoom, 1)); white-space: nowrap; }
.project-thread-settle, .project-thread-restore { grid-column: 6; }
.project-thread-settle { opacity: 0; }
.project-thread:hover .project-thread-settle, .project-thread-settle:focus-visible { opacity: 1; }
.project-thread-restore { color: var(--controls-primary-highlight); font-size: calc(10px * var(--zoom, 1)); }
.project-thread-rename { min-width: 0; border: 1px solid var(--controls-primary-highlight); border-radius: 4px; padding: 3px 4px; background: var(--surfaces-window); color: inherit; font: inherit; grid-column: span 2; }
.project-show-more { width: 100%; border: 0; padding: 5px 8px 5px 34px; background: none; color: var(--controls-primary-highlight); cursor: pointer; text-align: left; font-size: calc(11px * var(--zoom, 1)); }
.project-shelf { border-top: 1px solid var(--line); padding-top: 3px; }
.project-shelf-header span { flex: 1; font-size: calc(12px * var(--zoom, 1)); font-weight: 650; }
.project-shelf-header b { min-width: 18px; border-radius: 999px; padding: 1px 5px; background: var(--surfaces-inset); color: var(--muted); font-size: calc(10px * var(--zoom, 1)); text-align: center; }
.project-shelf .project-thread { grid-template-columns: 23px minmax(42px, 76px) minmax(0, 1fr) auto auto auto; }
.project-shelf .project-thread-status { display: none; }
.project-thread-menu { position: fixed; z-index: 250; display: grid; width: 180px; padding: 5px; border: 1px solid var(--line); border-radius: 9px; background: var(--surfaces-window); box-shadow: 0 14px 36px color-mix(in srgb, var(--surfaces-window) 38%, transparent); }
.project-thread-menu button { border: 0; border-radius: 5px; padding: 6px 9px; background: none; color: var(--text); cursor: pointer; text-align: left; font: inherit; font-size: calc(12px * var(--zoom, 1)); }
.project-thread-menu button:hover { background: var(--card-2); }
.project-thread-menu .destructive { margin-top: 4px; border-top: 1px solid var(--line); border-radius: 0 0 5px 5px; color: var(--controls-danger); }
.project-menu-label { padding: 5px 9px 2px; color: var(--muted); font-size: calc(10px * var(--zoom, 1)); text-transform: uppercase; }
.project-thread-menu .project-menu-nested { padding-left: 19px; }
/* Accounts (cockpit §5.13): one row per login, grouped by provider, with the terminal default in the group head. */
.accounts-dialog { display: flex; flex-direction: column; width: min(800px, 94vw); max-height: 86vh; padding: 0; overflow: hidden; }
.accounts-body { display: grid; gap: 18px; min-height: 0; padding: 26px 28px 18px; overflow: auto; }
.accounts-body h2 { margin: 0 0 -14px; }
.accounts-body .modal-subtitle, .accounts-body .engine-problem, .accounts-body .empty-subtle { margin: 0; }

/* Conversation reading shares the document's component renderer. */
.conversation-turn { margin-block: 20px 36px; }

@container (max-width: 400px) {

}

.conversation-context { display: flex; flex-direction: column; align-items: stretch; width: 100%; gap: 6px; }

.conversation-discussion > p { margin-block: 8px; white-space: pre-wrap; }
.conversation-discussion > blockquote { padding-left: 10px; border-left: 2px solid var(--line); white-space: pre-wrap; }
.conversation-discussion > button { margin: 6px 8px 0 0; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; }
.conversation-panel { min-width: 0; max-width: 100%; overflow-x: clip; }
.conversation-panel > header { grid-template-columns: minmax(0, 1fr); }
.conversation-title, .conversation-tools { min-width: 0; max-width: 100%; }
.conversation-panel[data-placement="side"] .conversation-messages { overflow-x: hidden; }
.navigation-rail[data-panel="conversation"] .rail-tab { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.conversation-rich-message .prosemirror-host { min-height: 0; animation: none; }
/* Candidate editors lay out at the column's width outside the transcript's flow (§6.15): attached, laid out, hidden, and inert. */
.conversation-staging { position: absolute; inset: 0 0 auto 0; height: 0; overflow: clip; pointer-events: none; }

/* The frame is the existing scroll viewport, so history anchoring and passage
   navigation retain one scroll owner. Its top meets the toolbar; the bottom
   leaves room for the newest/response tab and composer. The extra 50px is the
   two 24px insets plus borders, preserving the saved text and composer widths. */
.app-shell[data-transcript-style="panel"] .conversation-reading-area { margin-bottom: 16px; }
.app-shell[data-transcript-style="panel"] :is(.conversation-messages, .editor-scroll) { background: var(--surfaces-transcript); border: 1px solid var(--surfaces-transcript-border); border-radius: 14px; }
.app-shell[data-transcript-style="panel"] .conversation-messages { padding-bottom: 24px; }
.app-shell[data-transcript-style="panel"][data-transcript-shadow="drop-shadow"] :is(.conversation-messages, .editor-scroll, .theme-sample-transcript) { box-shadow: 0 calc(8px * var(--surfaces-transcript-shadow-strength)) calc(24px * var(--surfaces-transcript-shadow-strength)) max(0px, calc(4px * (var(--surfaces-transcript-shadow-strength) - 1))) color-mix(in srgb, var(--surfaces-transcript-shadow) min(100%, calc(65% * var(--surfaces-transcript-shadow-strength))), transparent); }
.app-shell[data-transcript-style="panel"] .conversation-panel[data-placement="center"] .conversation-messages { flex: none; width: min(100%, calc(var(--conversation-measure) + 50px + 2 * var(--scrollbar-size)), calc(100% - 2 * var(--conversation-gutter) + 50px)); margin-inline: auto; padding: 24px; }
.app-shell[data-transcript-style="panel"] .conversation-latest { bottom: -28px; }

/* The conversation route stays beside the transcript, without a contents pane. */
.conversation-reading-area { position: relative; display: flex; flex: 1; min-height: 100px; }
.conversation-panel[data-placement="side"] .conversation-messages { padding-left: 44px; }
.conversation-navigator { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.conversation-marker-list { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); max-height: calc(100% - 32px); width: 32px; overflow-y: auto; scrollbar-width: none; pointer-events: auto; padding-block: 4px; }
/* Hovering a marker widens it and its two neighbours; rows never change height, so the rail holds still. */
.conversation-marker { --marker-base: 12px; --marker-wave: 0px; display: flex; align-items: center; justify-content: flex-start; width: 32px; height: 10px; min-height: 0; padding: 0 4px; border: 0; border-radius: 4px; background: transparent; }
.conversation-marker span { display: block; width: max(var(--marker-base), var(--marker-wave)); height: 3px; border-radius: 2px; background: var(--muted); opacity: .55; transition: width 150ms ease, background-color 150ms ease, opacity 150ms ease; }
.conversation-marker[data-kind="comment"] { --marker-base: 20px; }
.conversation-marker[data-kind="comment"] span { background: var(--controls-primary); }
.conversation-marker[data-held] span { background: transparent; border: 1px solid var(--controls-primary); height: 4px; }
.conversation-marker[data-distance="0"] { --marker-wave: 24px; }
.conversation-marker[data-distance="1"] { --marker-wave: 18px; }
.conversation-marker[data-distance="2"] { --marker-wave: 14px; }
.conversation-marker[aria-current="location"] span, .conversation-marker:hover span, .conversation-marker:focus-visible span { opacity: 1; background: var(--text); }
.conversation-marker:focus-visible { outline: 1px solid var(--controls-primary); outline-offset: -1px; }
.conversation-marker-preview { position: fixed; z-index: 32; width: min(320px, calc(100vw - 32px)); max-height: calc(100vh - 24px); overflow: auto; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px var(--shadow); pointer-events: auto; overflow-wrap: anywhere; }
.conversation-marker-preview small { color: var(--muted); }
.conversation-marker-preview p, .conversation-marker-preview blockquote { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; white-space: pre-wrap; margin: 6px 0 0; }
.conversation-marker-preview blockquote { color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

.app-shell > .conversation-discussion { z-index: 31; overflow: auto; margin: 0; background: var(--card); box-shadow: 0 8px 24px var(--shadow); }

.usage-total strong { grid-column: 2; grid-row: 1 / 3; color: var(--document-headings); font-size: 40px; line-height: 1.2; }
.usage-total small { grid-column: 1; grid-row: 2; }
.usage-money small { display: block; color: var(--dim); font-size: 12px; }
.usage-savings { text-align: right; }
.usage-savings > span { color: var(--dim); font-size: 13px; }
.usage-savings strong { display: inline-block; margin-left: 16px; color: var(--controls-positive); font-size: 27px; line-height: 1.3; }
.usage-savings small { margin-top: 5px; }
.usage-providers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; margin-top: 22px; }
.usage-providers:empty { display: none; }
.usage-provider { min-width: 0; border: 1px solid var(--line); border-top: 2px solid var(--usage-provider-color); border-radius: 10px; padding: 17px 20px; background: color-mix(in srgb, var(--card-2) 55%, var(--card)); }
.usage-provider h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; font-weight: 600; }
.usage-provider h3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--usage-provider-color); }
.usage-provider > strong { display: block; margin: 15px 0 8px; color: var(--usage-provider-color); font-size: 30px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.usage-provider small { display: block; color: var(--dim); font-size: 12px; }
.usage-provider-share { height: 4px; margin-top: 15px; border-radius: 4px; background: var(--line); overflow: hidden; }
.usage-provider-share i { display: block; height: 100%; border-radius: inherit; background: var(--usage-provider-color); }
.usage-chart-section { margin: 24px 0 16px; }
.usage-chart-section h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
.usage-chart { position: relative; height: 218px; min-width: 0; }
.usage-metrics { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; border-block: 1px solid var(--line); padding: 12px 0; gap: 16px; }
.usage-metrics > div { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 15px; padding-left: 16px; border-left: 1px solid var(--line); }
.usage-metrics > div:first-child { padding-left: 0; border-left: 0; }
.usage-metrics span { color: var(--dim); font-size: 13px; }
.usage-metrics strong { font-size: 20px; line-height: 1.3; }
.usage-breakdown-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 12px 0; }
.usage-breakdown-heading h3 { font-size: 21px; }
.usage-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.usage-cost { font-weight: 700; }
.usage-token-count { color: var(--dim); }
.usage-table th { color: var(--dim); font-weight: 400; font-size: 12px; }
.usage-table th, .usage-table td { text-align: right; padding: 10px; border-bottom: 1px solid var(--line); }
.usage-table th:first-child, .usage-table td:first-child { text-align: left; padding-left: 0; }
.usage-share { display: inline-flex; gap: 9px; align-items: center; justify-content: flex-end; min-width: 110px; }
.usage-share > span { display: inline-block; width: 64px; height: 4px; border-radius: 4px; background: var(--line); }
.usage-share i { display: block; height: 100%; border-radius: inherit; background: var(--visuals-category-1); }
.usage-dialog > footer { padding: 12px 40px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); }
.usage-quality, .usage-empty { color: var(--dim); font-size: 13px; }
.usage-empty { padding: 48px 0; text-align: center; }
@media (max-width: 800px) {
  .usage-header { padding: 20px; }
  .usage-body { padding: 8px 20px; }
  .usage-money { align-items: flex-start; flex-direction: column; }
  .usage-savings { text-align: left; }
  .usage-metrics { grid-template-columns: 1fr 1fr; }
  .usage-metrics > div:nth-child(odd) { padding-left: 0; border-left: 0; }
}
@media (max-width: 500px) {
  .usage-header { flex-wrap: wrap; gap: 10px; }
  .usage-header > div { flex-basis: 100%; }
  .usage-total { grid-template-columns: 1fr; gap: 6px; }
  .usage-total strong { grid-column: 1; grid-row: 2; font-size: 32px; }
  .usage-total small { grid-row: 3; }
  .usage-savings strong { display: block; margin-left: 0; }
  .usage-windows { margin-left: 0; }
  .usage-segments button { padding: 7px 9px; }
  .usage-table th, .usage-table td { padding: 10px 5px; }
  .usage-table td:first-child { overflow-wrap: anywhere; }
  .usage-share { min-width: 0; }
  .usage-share > span { display: none; }
}

.workspace-path { color: var(--dim); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; align-self: center; min-width: 0; }
.workspace-controls > button { flex-shrink: 0; }

.usage-chart canvas { width: 100% !important; height: 100% !important; }

.engine-settings-dialog .setup-advanced > :not(summary) { margin-top: 16px; }
.settings-model { display: grid; gap: 12px; }
.settings-model summary { display: flex; flex-wrap: wrap; gap: 8px; cursor: pointer; }
.settings-model summary small { color: var(--dim); }
.provider-environment > fieldset { padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; }
.setup-field input[type="color"] { width: 64px; height: 40px; padding: 4px; }

.provider-setup-output { max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
.provider-install { max-width: 100%; }

.computer-controls section { border-top: 1px solid var(--line); padding-block: 12px; }
.computer-controls h3 { font-size: 14px; margin: 8px 0; }
.computer-controls label:not(.settings-check) { display: grid; gap: 5px; margin-block: 8px; }
.computer-controls .settings-check { display: flex; align-items: center; gap: 8px; margin-block: 9px; }
.computer-controls .settings-check input { width: auto; }

/* Visual review (docs/plans/open/visual-review): the annotation session, its card, and visual comment rows. New surfaces only; existing panels keep their styles. */
.visual-session { position: fixed; inset: 0; z-index: 90; background: color-mix(in srgb, var(--surfaces-window) 90%, transparent); color: var(--text); }
.visual-palette { position: absolute; top: 14px; left: 50%; z-index: 2; display: flex; gap: 2px; align-items: center; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); box-shadow: 0 8px 24px var(--shadow); transform: translateX(-50%); }
.visual-palette button { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--dim); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.visual-palette button kbd { font-family: var(--font-code); font-size: 10px; color: var(--muted); }
.visual-palette button[aria-pressed="true"] { background: color-mix(in srgb, var(--controls-primary-highlight) 16%, transparent); color: var(--controls-primary-highlight); }
.visual-palette-hint { padding: 0 10px; color: var(--muted); font-size: 12px; }
.visual-stage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; padding: 64px 448px 24px 24px; }
.visual-surface { position: relative; box-shadow: 0 20px 60px var(--shadow); user-select: none; touch-action: none; background: var(--card); }
.visual-session[data-tool="mark"] .visual-surface, .visual-session[data-tool="draw"] .visual-surface, .visual-session[data-tool="arrow"] .visual-surface { cursor: crosshair; }
.visual-session[data-tool="erase"] .visual-surface { cursor: cell; }
.visual-surface img { display: block; }
.visual-ink { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.visual-stroke path { fill: none; stroke: var(--controls-danger); stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; }
.visual-mark rect { fill: color-mix(in srgb, var(--controls-primary) 10%, transparent); stroke: var(--controls-primary); stroke-width: 2px; }
.visual-mark[data-kind="region"] rect { fill: color-mix(in srgb, var(--controls-danger) 8%, transparent); stroke: var(--controls-danger); stroke-dasharray: 8 6; }
.visual-mark[data-selected] rect { stroke-width: 3px; }
.visual-drag { fill: color-mix(in srgb, var(--controls-danger) 8%, transparent); stroke: var(--controls-danger); stroke-dasharray: 6 4; stroke-width: 2px; }
.visual-mark-label { position: absolute; transform: translateY(calc(-100% - 2px)); padding: 2px 8px; border-radius: 6px; background: var(--controls-primary); color: var(--controls-primary-text); font-size: 11.5px; font-weight: 700; white-space: nowrap; pointer-events: none; }
.visual-mark-label[data-kind="region"] { background: var(--controls-danger); color: var(--controls-danger-text); }
.visual-card { position: absolute; right: 24px; bottom: 24px; z-index: 2; display: grid; gap: 10px; width: min(400px, calc(100% - 48px)); padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 14px 36px var(--shadow); font-size: 13.5px; line-height: 1.4; }
.visual-card textarea { width: 100%; min-height: 64px; max-height: 40vh; field-sizing: content; resize: none; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surfaces-field); color: var(--text); font: inherit; outline: none; }
.visual-card textarea:focus { border-color: var(--controls-focus); }
.visual-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.visual-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card-2); color: var(--controls-primary-highlight); font-size: 11px; font-weight: 700; }
.visual-chip[data-kind="region"] { color: var(--controls-danger); }
.visual-chip[data-kind="stroke"] { color: var(--dim); }
.visual-chip[data-selected] { border-color: var(--controls-primary); }
.visual-chip b { color: var(--controls-positive); font-weight: 600; font-size: 10.5px; }
.visual-chip button { padding: 0 2px; border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
.visual-card footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.visual-card footer > button { flex: none; white-space: nowrap; }
.visual-context { flex: 0 0 100%; color: var(--dim); font-size: 11px; line-height: 1.3; }
.visual-notice { margin: 0; padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--controls-warning) 16%, transparent); color: var(--text); font-size: 12px; }
.visual-notice-action { margin-left: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--controls-primary-highlight); font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; }
/* Annotate on a page: the session sits over the preview stage, where the live view was, and the page keeps running beneath.
   The picture takes the stage and the card sits under it, so no part of the page is ever hidden behind the card. */
.preview-stage .visual-session { position: absolute; inset: 0; z-index: 5; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.preview-stage .visual-session .visual-palette { position: static; justify-self: center; margin: 10px 12px 0; transform: none; flex-wrap: wrap; justify-content: center; }
.preview-stage .visual-session .visual-stage { position: relative; inset: auto; padding: 12px 16px; }
.preview-stage .visual-session .visual-card { position: static; width: auto; max-height: 45%; overflow: auto; margin: 0 12px 12px; }
.visual-stage[data-scrolling] { cursor: progress; }
.visual-chip[data-elsewhere] { opacity: 0.7; }
/* Adjustments: plain steppers and swatches on the selected mark. */
.visual-adjustments { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); }
.visual-adjustments header { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.visual-adjustments header small { text-transform: none; letter-spacing: 0; color: var(--controls-primary-highlight); font-weight: 700; }
.visual-adjustment { display: grid; grid-template-columns: 96px auto 1fr auto; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.visual-adjustment[data-kind="text-color"], .visual-adjustment[data-kind="background"] { grid-template-columns: 96px 1fr; }
.visual-adjustment button { width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
.visual-adjustment button:disabled { opacity: 0.4; cursor: default; }
.visual-adjustment output { color: var(--controls-primary-highlight); font-weight: 700; text-align: center; }
.visual-swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.visual-adjustment .visual-swatch { width: 18px; height: 18px; border-radius: 50%; background: var(--swatch); }
.visual-adjustment .visual-swatch[data-as-is] { width: auto; padding: 0 6px; border-radius: 999px; background: var(--card); font-size: 11px; font-weight: 700; color: var(--dim); }
.visual-swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--controls-focus); }
.visual-adjustments footer { display: flex; gap: 6px; justify-content: flex-end; }
.visual-adjustment-summary { margin: 0; color: var(--dim); font-size: 11.5px; }
/* Then / now on a card: the original crop beside Strata's own capture of the same target. */
.visual-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 0; }
.visual-compare > div { display: grid; gap: 3px; }
.visual-compare img { display: block; width: 100%; max-height: 120px; object-fit: contain; border: 1px solid var(--line); border-radius: 6px; background: var(--card-2); }
.visual-compare figcaption { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.visual-compare-missing { display: grid; place-items: center; min-height: 60px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: 11.5px; }
.visual-compare-note { grid-column: 1 / -1; margin: 0; color: var(--dim); font-size: 11.5px; }
.conversation-visual-reply-row { display: inline-flex; gap: 4px; align-items: center; }
.conversation-visual-action { padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--controls-primary-highlight); font: inherit; font-size: calc(11px * var(--zoom, 1)); font-weight: 700; cursor: pointer; }
.visual-chip[data-elsewhere]::before { content: "↕ "; }
.visual-card-row { position: relative; margin: 0 0 10px; padding: 10px 12px 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--dim); font-size: calc(12.5px * var(--zoom, 1)); line-height: 1.35; }
.visual-card-row::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--controls-primary); }
.visual-card-row[data-status="ready"]::before, .visual-card-row[data-status="done"]::before { background: var(--controls-positive); }
.visual-card-row[data-status="failed"]::before { background: var(--controls-danger); }
.visual-card-row[data-status="done"] { opacity: .75; }
.visual-card-row[data-compact] { margin: 0; }
.visual-card-row > header { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; color: var(--controls-primary-highlight); font-size: calc(10.5px * var(--zoom, 1)); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.visual-card-row[data-status="ready"] > header, .visual-card-row[data-status="done"] > header { color: var(--controls-positive); }
.visual-status { margin-left: auto; padding: 1px 7px; border-radius: 999px; background: var(--card-2); color: var(--dim); letter-spacing: 0; text-transform: none; }
.visual-where { margin-bottom: 4px; color: var(--dim); font-size: calc(11.5px * var(--zoom, 1)); font-weight: 700; }
.visual-body { display: flex; gap: 10px; }
.visual-thumb { flex: none; width: 64px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card-2); overflow: hidden; cursor: pointer; }
.visual-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.visual-text { color: var(--text); overflow-wrap: anywhere; }
.visual-text em { color: var(--muted); }
.visual-meta { margin-top: 6px; color: var(--controls-primary-highlight); font-size: calc(11.5px * var(--zoom, 1)); font-weight: 700; }
.visual-reply { margin-top: 8px; padding: 7px 9px; border-radius: 8px; background: var(--card-2); color: var(--text); font-size: calc(12px * var(--zoom, 1)); }
.visual-reply small { display: block; margin-bottom: 2px; color: var(--dim); font-size: calc(10.5px * var(--zoom, 1)); font-weight: 700; }
.visual-error { margin: 6px 0 0; color: var(--controls-danger); }
.visual-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.visual-actions button { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); font: inherit; font-size: calc(11.5px * var(--zoom, 1)); font-weight: 700; cursor: pointer; }
.visual-actions button:hover { border-color: var(--controls-primary); }
.visual-action-positive { color: var(--controls-positive) !important; border-color: color-mix(in srgb, var(--controls-positive) 50%, transparent) !important; }
.visual-action-danger { color: var(--controls-danger) !important; border-color: color-mix(in srgb, var(--controls-danger) 50%, transparent) !important; }
.visual-action-quiet { color: var(--muted) !important; }
.visual-accepted { color: var(--controls-positive); font-weight: 700; }
.visual-pair { display: flex; gap: 8px; margin-top: 6px; }
.visual-pair > div { position: relative; flex: 1; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--card-2); }
.visual-pair > div > small { position: absolute; top: 4px; left: 6px; padding: 0 5px; border-radius: 4px; background: var(--card); color: var(--dim); font-size: calc(10px * var(--zoom, 1)); font-weight: 700; }
.visual-pair img { display: block; width: 100%; height: auto; }
.visual-pair-note { margin: 6px 0 0; color: var(--dim); font-size: calc(11.5px * var(--zoom, 1)); }
.visual-panel { position: fixed; right: 24px; bottom: 24px; z-index: 85; width: min(440px, calc(100% - 48px)); max-height: 72vh; overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 14px 36px var(--shadow); }
.visual-panel > header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.visual-history { margin: 10px 0 0; padding: 0 0 0 16px; color: var(--dim); font-size: 12.5px; }
.visual-history li { margin: 6px 0; }
.visual-history p { margin: 3px 0; color: var(--text); }
.visual-history-reply { padding: 5px 8px; border-radius: 6px; background: var(--card-2); }
.visual-history-reply small { display: block; color: var(--dim); font-weight: 700; }
.conversation-visual-staged { display: grid; gap: 6px; margin-bottom: 10px; }
.conversation-visual-card { position: relative; }
.conversation-visual-card[data-included="false"] { opacity: .55; }
.conversation-visual-card-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 4px 8px; }
.conversation-visual-card-actions > label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: calc(12px * var(--zoom, 1)); }
.conversation-visual-card-actions > button { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; font-size: calc(18px * var(--zoom, 1)); line-height: 1; cursor: pointer; }
.conversation-visual-card-actions > button:hover { background: var(--surfaces-inset); color: var(--controls-danger); }
.conversation-capacity { display: block; margin: 4px 12px 0; color: var(--muted); }
.conversation-capacity[data-over] { color: var(--controls-danger); }
.conversation-visual-replies { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.conversation-visual-reply { display: inline-flex; gap: 6px; align-items: center; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); font: inherit; font-size: calc(12px * var(--zoom, 1)); cursor: pointer; }
.conversation-visual-reply em { color: var(--controls-positive); font-style: normal; }
.conversation-visual-item em { margin-left: 6px; color: var(--controls-positive); font-style: normal; }
.conversation-attachment-markup { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 5px; background: var(--card-2); overflow: hidden; cursor: pointer; }
.conversation-attachment-markup img { display: block; width: 30px; height: 30px; object-fit: cover; }

/* Preview windows (docs/plans/open/visual-review, phase 2): the tab strip, the address row, and the hole the page draws in. New surfaces only. */
.preview-window { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.preview-tabstrip { display: flex; align-items: flex-end; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.preview-tab { display: inline-flex; align-items: center; gap: 8px; max-width: 260px; padding: 8px 14px; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; background: var(--card-2); color: var(--dim); font-size: calc(12.5px * var(--zoom, 1)); font-weight: 700; white-space: nowrap; cursor: pointer; }
.preview-tab[aria-selected="true"] { position: relative; top: 1px; background: var(--card); color: var(--text); border-color: color-mix(in srgb, var(--line) 60%, var(--text)); }
.preview-tab[data-kind="agent"] { border-style: dashed; border-color: color-mix(in srgb, var(--controls-positive) 45%, var(--line)); color: var(--controls-positive); background: color-mix(in srgb, var(--controls-positive) 8%, var(--card)); }
.preview-tab[data-kind="agent"][aria-selected="true"] { color: var(--controls-positive); }
.preview-tab[data-paused] { border-style: dashed; color: var(--controls-warning); border-color: color-mix(in srgb, var(--controls-warning) 45%, var(--line)); }
.preview-tab-name { overflow: hidden; text-overflow: ellipsis; }
.preview-tab-fav { width: 12px; height: 12px; border-radius: 3px; background: var(--controls-primary); flex: none; }
.preview-robot { width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.preview-live { width: 7px; height: 7px; border-radius: 50%; background: var(--controls-positive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--controls-positive) 22%, transparent); flex: none; }
.preview-tab-close { margin-left: 2px; color: var(--muted); font-size: calc(14px * var(--zoom, 1)); line-height: 1; }
.preview-tab-close:hover { color: var(--text); }
.preview-tab-add { padding: 6px 10px 8px; border: 0; background: transparent; color: var(--dim); font: inherit; font-size: calc(16px * var(--zoom, 1)); cursor: pointer; }
.preview-chrome { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.preview-nav { display: flex; gap: 4px; color: var(--dim); }
.preview-nav button { width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; font-size: calc(15px * var(--zoom, 1)); cursor: pointer; }
.preview-nav button:hover:not(:disabled) { background: var(--card-2); color: var(--text); }
.preview-nav button:disabled { opacity: .4; cursor: default; }
.preview-address { flex: 1; min-width: 0; }
.preview-address input { width: 100%; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surfaces-field); color: var(--text); font-family: var(--font-code); font-size: calc(12.5px * var(--zoom, 1)); outline: none; }
.preview-address input:focus { border-color: var(--controls-focus); }
.preview-agent-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid color-mix(in srgb, var(--controls-positive) 45%, var(--line)); border-radius: 999px; background: color-mix(in srgb, var(--controls-positive) 8%, var(--card)); color: var(--controls-positive); font: inherit; font-size: calc(12px * var(--zoom, 1)); font-weight: 700; white-space: nowrap; cursor: pointer; }
.preview-agent-pill b { color: var(--text); }
.preview-agent-pill[data-paused] { color: var(--controls-warning); border-color: color-mix(in srgb, var(--controls-warning) 45%, var(--line)); background: color-mix(in srgb, var(--controls-warning) 10%, var(--card)); cursor: default; }
.preview-agent-pill button { margin-left: 4px; padding: 2px 8px; border: 1px solid currentColor; border-radius: 999px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
.preview-size { position: relative; }
.preview-size > button, .preview-annotate { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--card-2); color: var(--text); font: inherit; font-size: calc(12px * var(--zoom, 1)); font-weight: 700; white-space: nowrap; cursor: pointer; }
.preview-size > button:disabled, .preview-annotate:disabled { opacity: .5; cursor: default; }
.preview-size-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; display: grid; min-width: 290px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 8px 24px var(--shadow); }
.preview-size-menu button { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.preview-size-menu button:hover { background: var(--card-2); }
.preview-size-menu button[aria-checked="true"] { color: var(--controls-primary-highlight); }
.preview-size-menu small { color: var(--muted); font-family: var(--font-code); }
.preview-annotate svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.preview-annotate[aria-pressed="true"] { border-color: var(--controls-danger); color: var(--controls-danger); background: color-mix(in srgb, var(--controls-danger) 12%, var(--card)); }
.preview-annotate kbd { font-family: var(--font-code); font-size: 10px; color: var(--muted); }
.preview-notice { margin: 0; padding: 6px 14px; border-bottom: 1px solid var(--line); color: var(--controls-danger); font-size: calc(12.5px * var(--zoom, 1)); }
.preview-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: color-mix(in srgb, var(--surfaces-window) 70%, var(--card)); }
.preview-frame { margin: 0; display: flex; flex-direction: column; }
.preview-stage[data-mode="fill"] .preview-frame { position: absolute; inset: 0; }
.preview-stage[data-mode="fill"] .preview-hole { position: absolute; inset: 0; }
.preview-stage:not([data-mode="fill"]) .preview-frame { align-items: center; margin: 24px auto; width: max-content; }
.preview-stage:not([data-mode="fill"]) .preview-hole { flex: none; box-shadow: 0 0 0 1px var(--line), 0 20px 60px var(--shadow); background: var(--card); }
.preview-frame figcaption { padding: 8px 0; color: var(--dim); font-size: calc(12px * var(--zoom, 1)); font-weight: 700; }
.preview-empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.preview-pill svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.agent-browser-badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid color-mix(in srgb, var(--controls-positive) 45%, var(--line)); border-radius: 999px; background: color-mix(in srgb, var(--controls-positive) 8%, var(--card)); color: var(--controls-positive); font-size: calc(11px * var(--zoom, 1)); font-weight: 700; }
.project-preview { display: inline-flex; align-items: center; padding: 0 6px; border: 0; background: transparent; color: var(--dim); font: inherit; font-size: calc(14px * var(--zoom, 1)); cursor: pointer; }
.project-preview:hover { color: var(--text); }
.preview-rail .state-running { color: var(--controls-positive); }
.preview-rail .state-idle { color: var(--muted); }

/* Dialog bodies scroll; headers, tabs and footers remain reachable. */
.setup-dialog.engine-dialog { overflow: hidden; }
.engine-facts dd { min-width: 0; overflow-wrap: anywhere; }
.computer-controls input:not([type="checkbox"]), .computer-controls select,
.setup-field > select { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surfaces-field); color: var(--text); font: inherit; }
.computer-controls input:focus-visible, .computer-controls select:focus-visible { outline: 2px solid var(--controls-focus); outline-offset: 2px; }
.computer-controls input[readonly] { font-family: var(--font-code); }
.setup-tabs { position: sticky; top: -20px; z-index: 2; background: var(--card); padding-top: 12px; }
.provider-environment > .setup-fields { grid-template-columns: minmax(100px, 1fr) minmax(100px, 1.5fr); align-items: end; }
.provider-accent { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.provider-accent button[data-color] { width: 24px; height: 24px; border: 2px solid var(--line); border-radius: 50%; background: var(--swatch); }
.provider-accent button[aria-checked="true"] { outline: 2px solid var(--controls-focus); outline-offset: 2px; }
.engine-settings-dialog .setup-field { margin-bottom: 0; display: grid; grid-template-columns: minmax(0, 1fr) 180px; align-items: center; gap: 10px; }
.engine-settings-dialog .setup-field small { grid-column: 1 / -1; }
.engine-settings-dialog h3 { margin: 18px 0 2px; font-size: 15px; font-weight: 800; color: var(--text); }
.engine-settings-dialog .setup-fields { gap: 8px; }
.settings-profile { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.settings-profile .setup-field { grid-template-columns: 1fr; }
.setup-switch { justify-content: space-between; flex-direction: row-reverse; width: 100%; }
.thread-panel-actions, .visual-actions, .agent-row, .agent-actions { flex-wrap: wrap; }
.preview-size-menu button { white-space: nowrap; }
.visual-mark-select { min-width: 0; text-align: left; overflow-wrap: anywhere; }
@media (max-width: 600px) { .engine-settings-dialog .setup-field, .provider-environment > .setup-fields { grid-template-columns: 1fr; } }

.engine-settings-dialog .setup-field, .engine-settings-dialog .setup-switch { font-weight: 700; }
.engine-settings-dialog .setup-fields > .setup-field, .settings-choice { padding: 12px 0; border-bottom: 1px solid var(--line); }
.engine-settings-dialog .setup-field > input, .engine-settings-dialog .setup-field > select { background: var(--surfaces-field); }
.settings-choice .engine-hint { margin: 2px 0 0; }

/* A single picker floats beside web links in every reading pane. */
.web-link-picker { position: fixed; z-index: 10000; display: flex; align-items: center; gap: 5px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); box-shadow: 0 8px 24px var(--shadow); }
.web-link-picker button { display: grid; place-items: center; width: 36px; height: 36px; padding: 5px; border: 0; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; }
.web-link-picker button[data-last="true"] { background: color-mix(in srgb, var(--controls-selected) 24%, var(--card)); }
.web-link-picker button:hover, .web-link-picker button:focus-visible { background: var(--card-2); outline: 1px solid var(--controls-selected); }
.web-link-picker button:disabled { opacity: .4; cursor: default; }
.web-link-picker img { width: 25px; height: 25px; }
.web-link-divider { width: 1px; height: 26px; background: var(--line); }
.web-link-picker button::after { content: attr(title); position: absolute; top: calc(100% + 6px); left: 0; width: max-content; max-width: min(240px, calc(100vw - 24px)); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: 12px/1.4 var(--font-text), sans-serif; pointer-events: none; opacity: 0; }
.web-link-picker button:hover::after, .web-link-picker button:focus-visible::after { opacity: 1; }
.conversation-discussion a, .thread-panel a { color: var(--document-link); text-decoration: underline; text-underline-offset: .16em; }

/* Inferred asks use the original passage and the existing floating discussion. */
.conversation-ask-tag { display:inline-flex; align-items:center; vertical-align:baseline; margin-left:6px; padding:1px 6px; border:1px solid color-mix(in srgb,var(--controls-warning) 45%,transparent); border-radius:999px; background:color-mix(in srgb,var(--controls-warning) 12%,transparent); color:var(--controls-warning); font:700 calc(11px * var(--zoom,1))/1.5 var(--font-text); cursor:pointer; }
.conversation-ask-tag[data-status="drafted"], .conversation-ask-tag[data-status="done"] { color:var(--controls-primary); border-color:var(--controls-primary); }
.conversation-ask-scan { display:inline-flex; align-items:center; justify-content:center; flex:none; width:26px; height:26px; border:0; padding:3px; background:transparent; color:var(--muted); cursor:pointer; }
.conversation-ask-scan svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
.conversation-ask-scan[data-state="working"] { color:var(--controls-warning); animation:conversation-pulse 1.5s ease-in-out infinite; }
.conversation-ask-scan[data-state="done"] { color:var(--controls-positive); }
.conversation-marker[data-kind="ask"] { color:var(--controls-warning); }
.conversation-marker .conversation-ask-marker { display:flex; align-items:center; justify-content:center; width:15px; height:15px; border:1px solid currentColor; border-radius:50%; background:transparent; font-size:calc(11px * var(--zoom)); }
.conversation-answer-popup { position:fixed; }
.conversation-answer-popup .reply-box textarea { width:100%; min-height:104px; }
.conversation-answer-popup>small { display:block; color:var(--muted); margin-top:8px; }
.conversation-answer-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }

.conversation-item-entry { display:flex; align-items:center; gap:6px; }
.conversation-item-entry>button:first-child { flex:1; text-align:left; }

.settings-connections { padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.connection-summary h3 { font-size: 20px; margin-top: 0; }
.connection-computer { font-weight: 700; overflow-wrap: anywhere; }
.connection-steps { display: flex; gap: 24px; flex-wrap: wrap; padding-left: 20px; margin-block: 18px; }
.connection-steps li { padding-right: 12px; }
.connection-steps [aria-current="step"] { font-weight: 700; }
.connection-progress { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-block: 12px; }
.connection-progress button, .connection-choices > .primary-button { margin: 8px 8px 8px 0; }
.connection-handoff ol { list-style: decimal; padding-left: 20px; }
.connection-handoff li { margin-block: 10px; }
.connection-diagnostics { margin-block: 18px; }
.local-engine-status { margin-top: 0; }
.pairing-qr { display: block; width: 240px; max-width: 100%; height: auto; background: white; margin-block: 12px; }

:root {
  /* Theme tokens (PRD §6.13). Strata's values here for first paint; the active
     theme overrides them on .app-shell, including the derived -text pairs. */
  --scrollbar-size: 10px;
  --font-text: "Baloo 2";
  --font-code: "JetBrains Mono";
  --surfaces-window: #000000;
  --surfaces-panel: #0d0d0d;
  --surfaces-transcript: #080808;
  --surfaces-transcript-border: #262626;
  --surfaces-transcript-shadow: #2e2e2e;
  --surfaces-transcript-shadow-strength: 1;
  --surfaces-inset: #405b77;
  --surfaces-user-message: #242638;
  --surfaces-tool-call: #090c09;
  --surfaces-field: #0d0d0d;
  --surfaces-code: #0d0e13;
  --surfaces-border: #525252;
  --surfaces-overlay: #eceef5;
  --surfaces-overlay-text: #14101f;
  --interface-primary: #f2f3f7;
  --interface-body: #d3d6df;
  --interface-secondary: #dbdce1;
  --interface-muted: #8a8f9e;
  --document-body: #ededed;
  --document-headings: #c9b3ff;
  --document-small-headings: #8fd0ff;
  --document-bold: #ffcb7b;
  --document-italic: #f2a0ae;
  --document-code: #8fe3a9;
  --document-link: #5cd6c2;
  --document-quote: #98a3c7;
  --document-table-heading: #dfc7ff;
  --controls-primary: #80e5d9;
  --controls-primary-text: #14101f;
  --controls-primary-highlight: #b7a6e8;
  --controls-selected: #5560a8;
  --controls-selected-text: #fbfaff;
  --controls-positive: #4cbd8a;
  --controls-positive-text: #14101f;
  --controls-warning: #e0aa4e;
  --controls-warning-text: #14101f;
  --controls-danger: #e07082;
  --controls-danger-text: #14101f;
  --controls-focus: #7aa7ff;
  --visuals-table-background: #27353a;
  --visuals-table-background-end: #1f3951;
  --visuals-table-toolbar: #000000;
  --visuals-table-header: #42687b;
  --visuals-table-border: #bdbdbd;
  --visuals-table-hover: #201a2c;
  --visuals-table-fill: linear-gradient(145deg, var(--visuals-table-background), var(--visuals-table-background-end));
  --visuals-category-1: #a98cf0;
  --visuals-category-2: #5fc9d9;
  --visuals-category-3: #e6b45e;
  --visuals-category-4: #62c99a;
  --visuals-category-5: #f08a6e;
  --visuals-category-6: #7fb0f5;
  --changes-added: #715cc7;
  --changes-removed: #f56d47;
  --people-you: #e58aa8;
  --people-you-text: #14101f;
  --people-agent-1: #a98cf0;
  --people-agent-1-text: #14101f;
  --people-agent-2: #7fb0f5;
  --people-agent-2-text: #14101f;
  --people-agent-3: #62c99a;
  --people-agent-3-text: #14101f;
  --people-agent-4: #e6b45e;
  --people-agent-4-text: #14101f;
  --people-external: #9fa6b6;
  --people-external-text: #14101f;
  --effects-primary: #ffa8d2;
  --effects-secondary: #6fc6ff;
  --effects-tertiary: #e2bdff;
  --effects-detail-1: #ffd27a;
  --effects-detail-2: #5dbb8c;
  --stars-smoke-base: #000;
  --effects-intensity: 1;
  --effects-speed: 0.45;
  --effects-side-window-opacity: 0.85;
  --selection-background: #353b62;
  --selection-text: #fbfaff;
  /* Brand, fixed on purpose: the logo pill reads the same in every theme (PRD §6.13). */
  --brand-surface: #f4f0fe;
  --brand-border: #e2dbf3;
  --brand-text: #241f31;
  /* Provider marks: the Claude glyph keeps its own color like the brand pill; the other marks take the text color. */
  --provider-claude: #d97757;
  /* Short aliases used throughout the stylesheet. */
  --bg: var(--surfaces-window);
  --card: var(--surfaces-panel);
  --card-2: var(--surfaces-inset);
  --line: var(--surfaces-border);
  --text: var(--interface-primary);
  --body: var(--interface-body);
  --dim: var(--interface-secondary);
  --muted: var(--interface-muted);
  --strata-font-family: var(--font-text);
  /* Review fills stay opaque over panel effects; text retains its semantic hue. */
  --changes-added-tint: color-mix(in srgb, var(--changes-added) 70%, var(--interface-primary));
  --changes-added-background: color-mix(in srgb, var(--changes-added) 24%, var(--surfaces-panel));
  --changes-removed-tint: color-mix(in srgb, var(--changes-removed) 70%, var(--interface-primary));
  --changes-removed-background: color-mix(in srgb, var(--changes-removed) 22%, var(--surfaces-panel));
  --controls-primary-tint: color-mix(in srgb, var(--controls-primary) 55%, var(--interface-primary));
  --controls-selected-tint: color-mix(in srgb, var(--controls-selected) 55%, var(--interface-primary));
  --shadow: color-mix(in srgb, var(--surfaces-window) 60%, transparent);
  font-family: var(--font-text), sans-serif;
  color: var(--text);
  background: var(--bg);
  font-synthesis: none;
}

* { box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { min-width: 960px; background: var(--bg); }
button, textarea, input { font: inherit; }
button { color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--controls-focus) 75%, var(--interface-primary)); outline-offset: 2px; }
button:disabled { opacity: .42; cursor: not-allowed; }
::selection { color: var(--selection-text); background: var(--selection-background); }
::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
::-webkit-scrollbar-thumb { border-radius: 5px; background: var(--surfaces-border); }
::-webkit-scrollbar-track { background: transparent; }

@keyframes pop-in { 0% { opacity: 0; transform: scale(.7) translateY(10px); } 65% { transform: scale(1.05) translateY(-3px); } 100% { opacity: 1; transform: scale(1); } }
@keyframes toast-in { 0% { opacity: 0; transform: translate(-50%, 24px) scale(.85); } 70% { transform: translate(-50%, -4px) scale(1.03); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes pulse-dot { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes bg-shift { 0%, 100% { background-position: 0 0; } 50% { background-position: 100% 100%; } }
@keyframes rise { 0% { opacity: 0; transform: translateY(20px); } 12%, 88% { opacity: .7; } 100% { opacity: 0; transform: translateY(-105vh); } }
@keyframes inner-a { 0%, 100% { transform: translate(0) scale(1); } 50% { transform: translate(34px, -24px) scale(1.18); } }
@keyframes inner-b { 0%, 100% { transform: translate(0) scale(1.08); } 50% { transform: translate(-28px, 20px) scale(.9); } }
@keyframes glow-a { 0%, 100% { transform: translate(0) scale(1); } 50% { transform: translate(120px, -70px) scale(1.25); } }
@keyframes glow-b { 0%, 100% { transform: translate(0) scale(1.1); } 50% { transform: translate(-90px, 60px) scale(.9); } }
@keyframes glow-c { 0%, 100% { transform: translate(0); } 50% { transform: translate(60px, 90px); } }
@keyframes mote-wander { 0%, 100% { transform: translate(0); } 25% { transform: translate(16px, -20px); } 50% { transform: translate(-10px, -34px); } 75% { transform: translate(-18px, -12px); } }
@keyframes slide-a { 0% { opacity: 0; transform: translateY(16px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes flash-ring { 0% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--controls-selected) 70%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@keyframes check-pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.4) rotate(8deg); } 100% { transform: scale(1); } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
/* Ambient animation system (docs/design/animations-handoff.md). Element trees come from AmbientDecor. */
/* The wash pans by compositor transform: a 300%-sized element translating
   -66.667% covers the same offsets as background-position 0%..100% on a
   300% background-size, without repainting the gradient per frame. */

.selection-menu, .annotation-composer { position: absolute; z-index: 40; }

.annotation-composer { display: flex; width: 330px; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; padding: 15px; background: var(--card); box-shadow: 0 20px 50px -14px color-mix(in srgb, var(--surfaces-window) 70%, transparent); animation: pop-in .28s cubic-bezier(.34,1.56,.64,1); }

.annotation-kinds button { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: transparent; color: var(--dim); font-size: calc(12px * var(--zoom, 1)); font-weight: 800; cursor: pointer; }

.annotation-composer blockquote { margin: 0 0 10px; border-left: 4px solid var(--controls-primary); border-radius: 0 9px 9px 0; padding: 6px 11px; background: var(--card-2); color: var(--dim); font-size: calc(13px * var(--zoom, 1)); font-style: italic; font-weight: 600; }
.annotation-context { margin: -2px 0 10px; color: var(--interface-muted); font-size: calc(11px * var(--zoom, 1)); font-weight: 800; }
.annotation-composer textarea, .send-composer > textarea { width: 100%; resize: none; border: 2px solid var(--line); border-radius: 12px; outline: none; padding: 9px 12px; background: var(--surfaces-field); color: var(--text); font-size: calc(14px * var(--zoom, 1)); font-weight: 500; }
.annotation-composer textarea:focus, .send-composer textarea:focus { border-color: var(--controls-primary); }
/* The writing modal's body text tracks the editor's body size (PRD paragraph 6.9). */
.annotation-composer textarea { min-height: 64px; flex: 1; font-size: calc(21px * var(--zoom, 1)); }
.composer-recipients { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; border: 0; padding: 0; }

/* The one thread surface: floating, movable, resizable; body text at the editor's body size. */

.keep-button, .revert-button, .outline-danger-button, .danger-button { border-radius: 999px; padding: 2px 12px; font-size: calc(12px * var(--zoom, 1)); font-weight: 800; cursor: pointer; transition: all .18s cubic-bezier(.34,1.56,.64,1); }

.save-round { margin-bottom: 5px; }

.empty-state, .empty-subtle { padding: 12px 0 8px; color: var(--dim); text-align: center; font-size: calc(14px * var(--zoom, 1)); font-weight: 700; }

.state-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }

.panel-counts { flex: none; color: var(--dim); font-size: calc(11px * var(--zoom, 1)); font-weight: 700; }

.modal-backdrop { position: fixed; z-index: 60; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--surfaces-window) 60%, transparent); backdrop-filter: blur(6px); }
.modal { width: min(560px, calc(100vw - 40px)); border: 1px solid var(--line); border-radius: 24px; padding: 26px 28px; background: var(--card); box-shadow: 0 40px 100px -24px color-mix(in srgb, var(--surfaces-window) 80%, transparent); animation: pop-in .34s cubic-bezier(.34,1.56,.64,1); }

.send-composer { position: relative; display: flex; flex-direction: column; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); }
.send-composer > textarea { flex: none; height: 70px; border-radius: 14px; padding: 11px 14px; font-size: calc(15px * var(--zoom, 1)); }

.exact-toggle { margin-left: auto; }
